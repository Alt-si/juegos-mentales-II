];
const M_MESES_DIAS = [31,28,31,30,31,30,31,31,30,31,30,31];
function mNiceCeil(v){ if(v<=10) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p >= v) return Math.round(m*p); return 10*p; }
function mGen(L){
  const k = Math.max(0, L - MDATA.length);                     // cuánto pasamos de las preguntas a mano
  const r = mulberry32((S.wseed||1)*31 + L*7919);
  const ri = (a,b) => a + Math.floor(r()*(b-a+1));
  const pick = arr => arr[Math.floor(r()*arr.length)];
  const range = (a, spread) => { const hi = mNiceCeil(Math.max(a+1, a*(1.3 + r()*spread))); return {lo:0, hi}; };
  const types = ["años","años","edad","multi","porcentaje","tiempo","fechas","ahorro","suma"];
  const t = pick(types);
  let q, a, u = "", n = "";
  if(t==="años"){
    let e1 = pick(M_EVENTS), e2 = pick(M_EVENTS); while(e2[1]===e1[1]) e2 = pick(M_EVENTS);
    if(e1[1] > e2[1]) [e1,e2] = [e2,e1];
    a = e2[1]-e1[1]; q = `¿Cuántos años pasaron entre ${e1[0]} y ${e2[0]}?`; u = "años";
    n = `${e1[0][0].toUpperCase()+e1[0].slice(1)} fue en ${e1[1]} y ${e2[0]}, en ${e2[1]}.`;
  } else if(t==="edad"){
    const e = pick(M_EVENTS.filter(x=>x[1]>=1900 && x[1]<=2015)); const y = ri(e[1]+5, 2025);
    a = y - e[1]; q = `Alguien nació el año de ${e[0]}. ¿Cuántos años cumplió en ${y}?`; u = "años";
    n = `${e[0][0].toUpperCase()+e[0].slice(1)} fue en ${e[1]}: ${y} − ${e[1]} = ${a}.`;
  } else if(t==="multi"){
    const A = ri(11, Math.min(999, 25 + k*2)), B = ri(3, Math.min(99, 9 + Math.floor(k/4)));
    a = A*B; q = `¿Cuánto es ${A} × ${B}?`; n = `${A} × ${B} = ${a}.`;
  } else if(t==="porcentaje"){
    const P = pick([5,10,15,20,25,30,40,50,60,75]); const N = 20*ri(2, Math.min(500, 10 + k));
    a = N*P/100; q = `¿Cuánto es el ${P} % de ${N}?`; n = `El ${P} % de ${N} es ${N} × ${P} ÷ 100 = ${a}.`;
  } else if(t==="tiempo"){
    const v = pick(["hd","mh","sm","dw","hw"]);
    if(v==="hd"){ const D = ri(2, 20 + k); a = D*24; q = `¿Cuántas horas hay en ${D} días?`; u = "horas"; n = `${D} × 24 = ${a}.`; }
    if(v==="mh"){ const H = ri(2, 12 + Math.floor(k/2)), M = ri(1, 59); a = H*60+M; q = `¿Cuántos minutos son ${H} horas y ${M} minutos?`; u = "minutos"; n = `${H} × 60 + ${M} = ${a}.`; }
    if(v==="sm"){ const M = ri(2, 30 + k); a = M*60; q = `¿Cuántos segundos hay en ${M} minutos?`; u = "segundos"; n = `${M} × 60 = ${a}.`; }
    if(v==="dw"){ const W = ri(3, 30 + k); a = W*7; q = `¿Cuántos días son ${W} semanas?`; u = "días"; n = `${W} × 7 = ${a}.`; }
    if(v==="hw"){ const W = ri(2, 10 + Math.floor(k/3)); a = W*168; q = `¿Cuántas horas hay en ${W} semanas?`; u = "horas"; n = `Una semana tiene 168 horas: ${W} × 168 = ${a}.`; }
  } else if(t==="fechas"){
    const m1 = ri(0, 9), m2 = ri(m1+1, 11), d1 = ri(1, M_MESES_DIAS[m1]), d2 = ri(1, M_MESES_DIAS[m2]);
    const doy = (m,d) => M_MESES_DIAS.slice(0,m).reduce((s,x)=>s+x,0) + d;
    a = doy(m2,d2) - doy(m1,d1);
    q = `En un año que no es bisiesto, ¿cuántos días hay desde el ${d1} de ${MESES[m1]} hasta el ${d2} de ${MESES[m2]}?`; u = "días";
    n = `El ${d1} de ${MESES[m1]} es el día ${doy(m1,d1)} del año y el ${d2} de ${MESES[m2]}, el día ${doy(m2,d2)}.`;
  } else if(t==="ahorro"){
    const X = 50*ri(2, 20 + Math.floor(k/2)), Wk = ri(4, 30 + Math.floor(k/2));
    a = X*Wk; q = `Si ahorrás $${mFmt(X)} por semana, ¿cuánta plata juntás en ${Wk} semanas?`; u = "pesos"; n = `${mFmt(X)} × ${Wk} = ${mFmt(a)}.`;
  } else {
    const N = ri(10, Math.min(1000, 30 + k*2)); a = N*(N+1)/2;
    q = `¿Cuánto da sumar todos los números del 1 al ${N}?`; n = `La fórmula es N × (N + 1) ÷ 2: ${N} × ${N+1} ÷ 2 = ${mFmt(a)}.`;
  }
  return Object.assign({q, a, u, n, tol:0, d:3, gen:true}, range(a, 1.6));
}
function mQuestion(L){ return L <= MDATA.length ? MDATA[M_ORDER[L-1]] : mGen(L); }

/* ---------- Secuencia: luces de colores y sonidos ---------- */
// El juego enciende una secuencia de botones, cada uno con su nota. Hay que repetirla en el mismo orden.
// Con cada acierto se agrega una luz. Arranca con 4 botones; con muchos puntos en una partida se suman más, hasta 8.
const SQ_COLORS = ["#22C55E","#EF4444","#FACC15","#3B82F6","#A855F7","#FB923C","#EC4899","#14B8A6"];
const SQ_NAMES  = ["verde","rojo","amarillo","azul","violeta","naranja","rosa","turquesa"];
const SQ_NOTES  = [329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
const SQ_UNLOCK = [1500, 4000, 8000, 14000];          // puntos para el 5.º, 6.º, 7.º y 8.º botón
const SQ_TIMEOUT = 6000;                              // tiempo máximo entre toque y toque
const SQ_REPLAY = 20, SQ_REVIVE = 50;                 // costos en monedas
S.simon = Object.assign({best:0, round:0, games:0, pads:4}, S.simon);
let Q = null;

function sqTone(i, ms){
  try{
    if(!actx) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = "triangle"; o.frequency.value = SQ_NOTES[i];
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + ms/1000);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + ms/1000 + 0.05);
  }catch(e){}
}
function sqBuzz(){
  try{
    if(!actx) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(70, t + .45);
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .5);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .55);
  }catch(e){}
}
function sqBoardHtml(n, center){
  const R = 96, r = 40, rad = a => a*Math.PI/180;
  let paths = "";
  for(let i=0;i<n;i++){
    const a0 = -90 + i*360/n, a1 = -90 + (i+1)*360/n, large = (a1-a0) > 180 ? 1 : 0;
    const P = (rr, a) => `${(rr*Math.cos(rad(a))).toFixed(2)} ${(rr*Math.sin(rad(a))).toFixed(2)}`;
    paths += `<path class="sqpad" data-sq="${i}" role="button" tabindex="0" aria-label="Botón ${SQ_NAMES[i]}, tecla ${i+1}" style="--pc:${SQ_COLORS[i]}"
      d="M${P(R,a0)} A${R} ${R} 0 ${large} 1 ${P(R,a1)} L${P(r,a1)} A${r} ${r} 0 ${large} 0 ${P(r,a0)} Z"/>`;
  }
  return `<svg viewBox="-100 -100 200 200" aria-label="Tablero de ${n} botones">${paths}</svg>
    <div class="sqcenter"><b id="sqc" class="num">${center||""}</b><span id="sqcs"></span></div>`;
}
function sqNextGoal(score){
  const k = SQ_UNLOCK.findIndex(t => score < t);
  return k < 0 ? null : {pad: 5 + k, at: SQ_UNLOCK[k], from: k ? SQ_UNLOCK[k-1] : 0};
}

/* pantalla de inicio del juego */
function sqScreen(){
  clearTimers(); G = null; W = null; M = null; Q = null;
  const s = S.simon, goal = sqNextGoal(s.best);
  $app.innerHTML = `${topBar("home")}
  <div class="hello"><div class="titlerow"><h1>Secuencia</h1>${howBtn("secuencia")}</div>
  <p>Mirá y escuchá la secuencia de luces, y repetila en el mismo orden. Cada vez que acertás se suma una luz más.</p></div>
  <div class="dstats sqstats">
    <div><b class="num">${mFmt(s.best)}</b><span>récord de puntos</span></div>
    <div><b class="num">${s.round}</b><span>mejor ronda</span></div>
    <div><b class="num">${s.pads}</b><span>botones alcanzados</span></div>
    <div><b class="num">${s.games}</b><span>partidas</span></div>
  </div>
  <div class="sqboard idle">${sqBoardHtml(4, "▶")}</div>
  <p class="hint sqgoal">${goal ? `Llegá a <b>${mFmt(goal.at)}</b> puntos en una partida para sumar el ${goal.pad}.º botón.` : "¡Ya llegaste a los 8 botones!"}</p>
  <div class="actions"><button class="btn primary" data-sqa="start">Empezar</button></div>`;
  const b = $app.querySelector(".sqboard"); if(b) b.addEventListener("click", ()=>sqStart());
  howFirst("secuencia");
}

/* partida */
function sqStart(){
  clearTimers(); G = null; W = null; M = null;
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  try{ actx && actx.state === "suspended" && actx.resume(); }catch(e){}
  Q = {seq:[], pads:4, round:0, score:0, idx:0, phase:"show", revived:false, replayed:false, rev:false, t:[]};
  $app.innerHTML = `${topBar("secuencia")}
  <div class="sqplay">
    <div class="hud"><span>Ronda <b id="sqround">0</b></span><span class="hudr"><span><b id="sqscore" class="num">0</b> puntos</span>${howBtn("secuencia")}</span></div>
    <div class="sqbanner" id="sqbanner" hidden></div>
    <div class="sqboard wait" id="sqboard"></div>
    <p class="hint sqmsg" id="sqmsg">Mirá y escuchá…</p>
    <div class="sqgoalbar" id="sqgoal"></div>
    <div class="sqctl" id="sqctl"></div>
  </div>`;
  sqRenderBoard();
  sqNext();
}
function sqT(fn, ms){ const id = setTimeout(fn, ms); Q.t.push(id); timers.push(id); return id; }
function sqClearT(){ if(!Q) return; Q.t.forEach(clearTimeout); Q.t = []; }
function sqRenderBoard(){
  const b = document.getElementById("sqboard"); if(!b) return;
  b.innerHTML = sqBoardHtml(Q.pads, Q.round || "");
  b.classList.toggle("p8", Q.pads >= 7);
  const svg = b.querySelector("svg");
  svg.addEventListener("pointerdown", e => { const p = e.target.closest && e.target.closest("[data-sq]"); if(p){ e.preventDefault(); sqPress(+p.dataset.sq); } });
  svg.addEventListener("keydown", e => { if((e.key==="Enter"||e.key===" ") && e.target.dataset && e.target.dataset.sq!==undefined){ e.preventDefault(); sqPress(+e.target.dataset.sq); } });
}
function sqCenter(big, small){
  const c = document.getElementById("sqc"), s = document.getElementById("sqcs");
  if(c && big!==undefined) c.textContent = big;
  if(s) s.textContent = small || "";
}
function sqMsg(t){ const m = document.getElementById("sqmsg"); if(m) m.innerHTML = t; }
function sqHud(){
  const r = document.getElementById("sqround"), s = document.getElementById("sqscore");
  if(r) r.textContent = Q.round; if(s) s.textContent = mFmt(Q.score);
  const g = document.getElementById("sqgoal"), goal = sqNextGoal(Q.score);
  if(g) g.innerHTML = goal
    ? `<div class="sqgtxt"><span>Próximo botón (${goal.pad}.º)</span><span class="num">${mFmt(Q.score)} / ${mFmt(goal.at)}</span></div><div class="bar"><i style="width:${Math.min(100,(Q.score-goal.from)/(goal.at-goal.from)*100)}%"></i></div>`
    : `<div class="sqgtxt"><span>¡Los 8 botones en juego!</span></div>`;
  const ctl = document.getElementById("sqctl");
  if(ctl && Q.phase !== "over") ctl.innerHTML = `<button class="help" data-sqa="replay" ${Q.phase!=="input"||Q.replayed||S.coins<SQ_REPLAY?"disabled":""}>Ver de nuevo<small><span class="coin"></span>${SQ_REPLAY}</small></button>`;
}
function sqLight(i, ms, sound=true){
  const p = document.querySelector(`.sqpad[data-sq="${i}"]`); if(!p) return;
  p.classList.add("on"); if(sound) sqTone(i, ms);
  const id = setTimeout(()=>p.classList.remove("on"), ms); timers.push(id);
}
function sqNext(){
  Q.round++; Q.idx = 0; Q.replayed = false;
  const want = 4 + SQ_UNLOCK.filter(t => Q.score >= t).length;
  let added = false;
  if(want > Q.pads){ Q.pads = want; added = true; sqRenderBoard(); }
  Q.seq.push(added ? Q.pads - 1 : Math.floor(Math.random()*Q.pads));     // un botón nuevo entra en la secuencia
  Q.rev = Q.round >= 10 && Q.round % 5 === 0;
  const ban = document.getElementById("sqbanner");
  if(ban){
    if(added){ ban.hidden = false; ban.className = "sqbanner new"; ban.innerHTML = `<b>¡Nuevo botón!</b> Ahora juegan ${Q.pads} colores y cada ronda vale más.`; beep(988,.1); setTimeout(()=>beep(1319,.12),110); }
    else if(Q.rev){ ban.hidden = false; ban.className = "sqbanner rev"; ban.innerHTML = `<b>Ronda especial:</b> repetí la secuencia <b>AL REVÉS</b>. Vale el doble.`; }
    else ban.hidden = true;
  }
  sqHud();
  sqPlay(added || Q.rev ? 1500 : 650);
}
function sqSpeed(){ return {on: Math.max(220, 560 - Q.round*12), gap: Math.max(80, 200 - Q.round*4)}; }
function sqPlay(delay){
  sqClearT();
  Q.phase = "show"; Q.idx = 0;
  const b = document.getElementById("sqboard"); if(b) b.classList.add("wait");
  sqCenter(Q.round, "mirá"); sqMsg("Mirá y escuchá…"); sqHud();
  const {on, gap} = sqSpeed();
  Q.seq.forEach((k, j) => sqT(()=>sqLight(k, on), delay + j*(on+gap)));
  sqT(()=>{
    Q.phase = "input";
    if(b) b.classList.remove("wait");
    sqCenter(Q.round, Q.rev ? "¡al revés!" : "tu turno");
    sqMsg(Q.rev ? "Tocá los botones <b>al revés</b>: del último al primero." : "Tu turno: tocá los botones en el mismo orden.");
    sqHud(); sqArmTimeout();
  }, delay + Q.seq.length*(on+gap));
}
function sqArmTimeout(){
  if(Q.to) clearTimeout(Q.to);
  Q.to = sqT(function check(){
    if(!Q || Q.phase !== "input") return;
    const how = document.getElementById("howsheet");
    if(how && !how.hidden){ Q.to = sqT(check, 1000); return; }      // con la ayuda abierta, no corre el reloj
    sqFail(true);
  }, SQ_TIMEOUT);
}
function sqPress(i){
  if(!Q || Q.phase !== "input" || i >= Q.pads) return;
  sqLight(i, 220);
  const n = Q.seq.length, want = Q.rev ? Q.seq[n-1-Q.idx] : Q.seq[Q.idx];
  if(i !== want) return sqFail(false, want);
  Q.idx++;
  if(Q.idx < n){ sqArmTimeout(); return; }
  // ronda completa
  sqClearT();
  Q.phase = "ok";
  let pts = n * 10 * (Q.pads - 3) * (Q.rev ? 2 : 1);
  if(Q.replayed) pts = Math.round(pts/2);
  Q.score += pts;
  sqCenter("+" + pts, "¡bien!"); sqMsg(`¡Bien! La secuencia tiene ahora ${n+1} luces.`);
  sqHud();
  sqT(()=>sqNext(), 700);
}
function sqFail(timeout, want){
  sqClearT();
  Q.phase = "fail";
  sqBuzz();
  if(want !== undefined) sqT(()=>sqLight(want, 650, false), 250);
  const b = document.getElementById("sqboard"); if(b){ b.classList.add("wait","shake"); sqT(()=>b.classList.remove("shake"), 500); }
  sqCenter("✕", timeout ? "sin tiempo" : "¡uy!");
  sqMsg(timeout ? "Se acabó el tiempo para tocar." : `Era el <b>${SQ_NAMES[want]}</b>.`);
  const ctl = document.getElementById("sqctl");
  if(!Q.revived && S.coins >= SQ_REVIVE && ctl){
    Q.phase = "over";
    ctl.innerHTML = `<div class="sqrevive">
      <button class="btn primary" data-sqa="revive">Seguir jugando<small><span class="coin"></span>${SQ_REVIVE}</small></button>
      <button class="btn" data-sqa="end">Terminar</button></div>`;
    return;
  }
  sqT(()=>sqEnd(), 1300);
}
function sqEnd(){
  sqClearT(); clearTimers();
  const s = S.simon, rounds = Q.round - 1, score = Q.score;
  const record = score > s.best;
  s.games++; if(record) s.best = score; if(rounds > s.round) s.round = rounds; if(Q.pads > s.pads) s.pads = Q.pads;
  const coins = Math.round(score/120) + rounds, xp = Math.round(score/15);
  S.coins += coins; S.xp += xp; save();
  Q.phase = "end";
  if(record && score > 0){ beep(880,.12); setTimeout(()=>beep(1175,.15),130); }
  $app.innerHTML = `${topBar("secuencia")}
  <div class="result mood-${record && score>0 ? "good" : "warn"}">
    <div class="verdict">
      <h1>${record && score>0 ? "¡Nuevo récord!" : "Fin de la partida"}</h1>
      <p>Llegaste a la ronda <b class="num">${Q.round}</b> con <b>${Q.pads}</b> botones</p>
      <div class="mscore"><b class="num">${mFmt(score)}</b><span>puntos${record ? "" : ` · récord: ${mFmt(s.best)}`}</span></div>
      <div class="sqdots">${Q.seq.map((k,j)=>`<i style="background:${SQ_COLORS[k]};--i:${j}" title="${SQ_NAMES[k]}"></i>`).join("")}</div>
    </div>
    <div class="gains"><span><span class="coin"></span>+<span class="num">${coins}</span></span><span>+<span class="num">${xp}</span> XP</span></div>
    ${sqNextGoal(s.best) ? `<p class="hint">Llegá a ${mFmt(sqNextGoal(s.best).at)} puntos en una partida para jugar con ${sqNextGoal(s.best).pad} botones.</p>` : ""}
    <div class="actions">
      <button class="btn primary" data-sqa="start">Jugar de nuevo</button>
      <button class="btn" data-go="home">Inicio</button>
    </div>
  </div>`;
  if(record && score>0) confetti();
}
function sqAction(a){
  if(a === "start") return sqStart();
  if(!Q) return;
  if(a === "replay"){
    if(Q.phase !== "input" || Q.replayed || S.coins < SQ_REPLAY) return;
    S.coins -= SQ_REPLAY; Q.replayed = true; save();
    const c = document.querySelector(".coins .num"); if(c) c.textContent = S.coins;
    toast("Te mostramos la secuencia otra vez. Esta ronda vale la mitad.");
    return sqPlay(500);
  }
  if(a === "revive"){
    if(Q.revived || S.coins < SQ_REVIVE) return;
    S.coins -= SQ_REVIVE; Q.revived = true; save();
    const c = document.querySelector(".coins .num"); if(c) c.textContent = S.coins;
    const ctl = document.getElementById("sqctl"); if(ctl) ctl.innerHTML = "";
    return sqPlay(700);
  }
  if(a === "end") return sqEnd();
}
document.addEventListener("keydown", e => {
  if(!Q || Q.phase !== "input" || !/^[1-8]$/.test(e.key)) return;
  const how = document.getElementById("howsheet"); if(how && !how.hidden) return;
  sqPress(+e.key - 1);
});

/* ---------- Bloques deslizantes: motor ---------- */
// Tablero de 6×6. La salida está a la derecha de la fila 3 (índice 2). El bloque 0 es el rojo (horizontal, largo 2).
// Un bloque: {r, c, len, h} (h = horizontal). La posición variable de cada bloque es c si es horizontal y r si es vertical.
// Los puzzles vienen de data/bloques.js (generados con tools/gen-bloques.js): 36 caracteres por filas,
// "." vacío, "x" pared fija, "A" bloque rojo, "B".."Z" otros bloques.
const BK_N = 6, BK_EXIT = 2;
function bkParse(str){
  const cells = {}; const walls = [];
  [...str].forEach((ch, i) => { if(ch === "x") walls.push(i); else if(ch !== ".") (cells[ch] = cells[ch] || []).push(i); });
  const blocks = Object.keys(cells).sort().map(ch => {
    const a = cells[ch], r0 = Math.floor(a[0]/BK_N), c0 = a[0] % BK_N;
    const h = a.length > 1 && Math.floor(a[1]/BK_N) === r0;
    return {r:r0, c:c0, len:a.length, h, red: ch === "A"};
  });
  return {blocks, walls};
}
const bkPos = b => b.h ? b.c : b.r;
function bkGrid(blocks, pos, walls){
  const g = new Int8Array(BK_N*BK_N).fill(-1);
  (walls||[]).forEach(c => g[c] = 99);
  blocks.forEach((b,i)=>{ const p = pos[i]; for(let k=0;k<b.len;k++) g[b.h ? b.r*BK_N+p+k : (p+k)*BK_N+b.c] = i; });
  return g;
}
// hasta dónde puede ir un bloque: [mínimo, máximo] de su posición
function bkRange(blocks, pos, walls, i, grid){
  const b = blocks[i], p = pos[i], g = grid || bkGrid(blocks, pos, walls);
  let lo = p, hi = p;
  while(lo > 0 && g[b.h ? b.r*BK_N+lo-1 : (lo-1)*BK_N+b.c] === -1) lo--;
  while(hi + b.len < BK_N && g[b.h ? b.r*BK_N+hi+b.len : (hi+b.len)*BK_N+b.c] === -1) hi++;
  return [lo, hi];
}
const bkGoal = pos => pos[0] === BK_N - 2;
const bkKey = pos => pos.join("");
// mínimo de movimientos desde pos hasta sacar el rojo (deslizar un bloque cualquier distancia = 1 movimiento)
function bkSolve(blocks, pos, walls){
  if(bkGoal(pos)) return {moves:0, path:[]};
  const prev = new Map([[bkKey(pos), null]]); let frontier = [pos];
  while(frontier.length){
    const nf = [];
    for(const s of frontier){
      const g = bkGrid(blocks, s, walls);
      for(let i=0;i<blocks.length;i++){
        const [lo, hi] = bkRange(blocks, s, walls, i, g);
        for(let p=lo;p<=hi;p++){
          if(p === s[i]) continue;
          const n = s.slice(); n[i] = p; const k = bkKey(n);
          if(prev.has(k)) continue;
          prev.set(k, [bkKey(s), i, p]);
          if(bkGoal(n)){
            const path = []; let cur = k;
            while(prev.get(cur)){ const [pk, bi, bp] = prev.get(cur); path.push([bi, bp]); cur = pk; }
            return {moves: path.length, path: path.reverse()};
          }
          nf.push(n);
        }
      }
    }
    frontier = nf;
    if(prev.size > 120000) return null;
  }
  return null;
}

/* ---------- Bloques deslizantes: juego ---------- */
const BK_BANK = String(window.__bloques||"").split(";").filter(Boolean).map(x=>{ const [b, m] = x.split(":"); return {b, m:+m}; });
S.games.bloques = S.games.bloques || {};
const BK_BY = {};
BK_BANK.forEach((p,i)=>(BK_BY[p.m] = BK_BY[p.m] || []).push(i));
const BK_MS = Object.keys(BK_BY).map(Number).sort((a,b)=>a-b);
const BK_MAXM = BK_MS.length ? BK_MS[BK_MS.length-1] : 2;
// cada jugador recibe los puzzles en otro orden
BK_MS.forEach(m=>{ const a = BK_BY[m], r = mulberry32((S.wseed||1) + m*7919); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } });
// dificultad buscada (mínimo de movimientos) para cada nivel: sube rápido al principio y después más despacio
const BK_SHIFT = 19;           // el nivel 1 tiene la dificultad que antes tenía el nivel 20
function bkTarget(L){
  L += BK_SHIFT;
  const top = Math.max(4, Math.min(BK_MAXM, 34) - 2);
  const base = 2 + (top - 2) * (1 - Math.exp(-L/110));
  const j = Math.floor(mulberry32((S.wseed||1)*13 + L)()*3) - 1;
  return Math.max(2, Math.round(base) + j);
}
const BK_ASSIGN = [], BK_USED = new Set(), BK_REP = {};
const BK_WALLS_FROM = 21;      // antes del nivel 21, solo tableros sin paredes
function bkPickFrom(m, walls){ const a = BK_BY[m]; if(!a) return -1; for(const i of a) if(!BK_USED.has(i) && (walls || !BK_BANK[i].b.includes("x"))) return i; return -1; }
function bkIdxFor(L){
  while(BK_ASSIGN.length < L){
    const l = BK_ASSIGN.length + 1, d = bkTarget(l), walls = l >= BK_WALLS_FROM;
    let pick = -1;
    // primero, un puzzle sin usar de dificultad parecida (±4 movimientos)
    for(let off=0; off<=4 && pick<0; off++) for(const m of [d-off, d+off]){ const i = bkPickFrom(m, walls); if(i >= 0){ pick = i; break; } }
    // si ya se usaron todos los de esa dificultad, se repite uno de esa dificultad (nunca baja a uno fácil)
    if(pick < 0){
      const m = BK_MS.reduce((a,x)=>Math.abs(x-d) < Math.abs(a-d) ? x : a, BK_MS[0]);
      const a = BK_BY[m]; BK_REP[m] = ((BK_REP[m]||0) + 1) % a.length; pick = a[BK_REP[m]];
    }
    BK_USED.add(pick); BK_ASSIGN.push(pick);
  }
  return BK_ASSIGN[L-1];
}
const bkStars = (moves, min, hints) => { let s = moves <= min ? 3 : moves <= min + Math.max(2, Math.ceil(min*.5)) ? 2 : 1; return hints ? Math.min(s, 2) : s; };
const BK_HINT = [30, 50, 80];
const BK_COLORS = ["var(--c2)","var(--c3)","var(--c6)","var(--c5)","var(--c1b)","var(--c4)","var(--c3b)","var(--c2b)","var(--c1)"];
const BK_STAGES = ["Primeros movimientos","Destrabando","Calles cortadas","Embotellamiento","Hora pico","Laberinto","Sin salida a la vista","Paciencia","Maestro del bloque","Imposible… o no"];

function blevels(){
  levelMap({title:"Bloques deslizantes", desc:"Deslizá los bloques hasta sacar el bloque rojo por la salida. Cada bloque se mueve solo en su dirección.",
    store:S.games.bloques, total:Infinity, names:BK_STAGES, attr:"blv", how:"bloques",
    label:s=>{ let lo = 99, hi = 0; for(let l=s*20+1; l<=s*20+20; l++){ const m = BK_BANK[bkIdxFor(l)].m; lo = Math.min(lo, m); hi = Math.max(hi, m); } return `se resuelven en ${lo}–${hi} movimientos`; }});
}

let B = null;
function bplay(L){
  clearTimers(); G = null; W = null; M = null; Q = null;
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  const p = BK_BANK[bkIdxFor(L)], {blocks, walls} = bkParse(p.b);
  const start = blocks.map(bkPos);
  B = {L, blocks, walls, start, pos:start.slice(), min:p.m, moves:0, hist:[], hints:0, done:false, drag:null};
  $app.innerHTML = `${topBar("blevels")}
  <div class="bkplay">
    <div class="hud"><span>Nivel <b>${L}</b></span><span class="hudr"><span>Movimientos: <b id="bkmoves">0</b> · mínimo: <b>${B.min}</b></span>${howBtn("bloques")}</span></div>
    <div class="bkframe" id="bkframe">
      <div class="bkboard" id="bkboard">
        ${walls.map(c=>`<span class="bkwall" style="left:${c%BK_N/BK_N*100}%;top:${Math.floor(c/BK_N)/BK_N*100}%"></span>`).join("")}
        ${blocks.map((b,i)=>`<button class="bkblk ${b.h?"h":"v"} ${b.red?"red":""}" data-bk="${i}" aria-label="${b.red?"Bloque rojo":`Bloque ${b.h?"horizontal":"vertical"} de ${b.len}`}"
          style="${b.red?"":`--bc:${BK_COLORS[(i-1+BK_COLORS.length)%BK_COLORS.length]};`}width:${(b.h?b.len:1)/BK_N*100}%;height:${(b.h?1:b.len)/BK_N*100}%">${b.red?"<span>➜</span>":""}</button>`).join("")}
        <span class="bkghost" id="bkghost" hidden></span>
      </div>
      <span class="bkexit" aria-hidden="true"></span>
    </div>
    <p class="hint" id="bkmsg">Arrastrá los bloques con el dedo. Sacá el bloque rojo por la salida.</p>
    <div class="bkctl">
      <button class="help" data-bka="undo">Deshacer<small>gratis</small></button>
      <button class="help" data-bka="reset">Reiniciar<small>volver al inicio</small></button>
      <button class="help" data-bka="hint">Pista<small><span class="coin"></span><span id="bkhcost">${BK_HINT[0]}</span></small></button>
    </div>
  </div>`;
  bkRender(false);
  const board = document.getElementById("bkboard");
  board.addEventListener("pointerdown", bkDown);
  board.addEventListener("pointermove", bkMove);
  board.addEventListener("pointerup", bkUp);
  board.addEventListener("pointercancel", bkUp);
  board.addEventListener("keydown", bkKey2);
}
function bkPlace(el, b, p){
  el.style.left = `${(b.h ? p : b.c)/BK_N*100}%`;
  el.style.top = `${(b.h ? b.r : p)/BK_N*100}%`;
}
function bkRender(){
  const els = document.querySelectorAll(".bkblk");
  els.forEach(el=>{ const i = +el.dataset.bk; bkPlace(el, B.blocks[i], B.pos[i]); });
  const m = document.getElementById("bkmoves"); if(m) m.textContent = B.moves;
}
// mueve un bloque con animación (desde donde se ve ahora hasta su casilla)
function bkAnimate(el, b, fromPx){
  el.classList.add("drag");
  el.style.transform = fromPx ? (b.h ? `translateX(${fromPx}px)` : `translateY(${fromPx}px)`) : "";
  void el.offsetWidth;
  el.classList.remove("drag");
  el.style.transform = "";
}
function bkSet(i, np, fromPx){
  const el = document.querySelector(`.bkblk[data-bk="${i}"]`), b = B.blocks[i];
  if(np !== B.pos[i]){
    B.hist.push(B.pos.slice()); B.pos[i] = np; B.moves++;
    beep(520 + (i%6)*40, .04);
    bkHintOff();
  }
  if(el){ bkPlace(el, b, B.pos[i]); bkAnimate(el, b, fromPx); }
  const m = document.getElementById("bkmoves"); if(m) m.textContent = B.moves;
  if(bkGoal(B.pos)) bkWin();
}
function bkDown(e){
  const el = e.target.closest && e.target.closest(".bkblk"); if(!el || !B || B.done) return;
  e.preventDefault();
  const i = +el.dataset.bk, [lo, hi] = bkRange(B.blocks, B.pos, B.walls, i);
  const board = document.getElementById("bkboard");
  B.drag = {i, el, x:e.clientX, y:e.clientY, lo, hi, cell: board.clientWidth/BK_N, p:B.pos[i], cur:B.pos[i], id:e.pointerId};
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
  el.classList.add("drag");
}
function bkMove(e){
  const d = B && B.drag; if(!d || e.pointerId !== d.id) return;
  const b = B.blocks[d.i], delta = (b.h ? e.clientX - d.x : e.clientY - d.y) / d.cell;
  d.cur = Math.max(d.lo, Math.min(d.hi, d.p + delta));
  d.el.style.transform = b.h ? `translateX(${(d.cur-d.p)*d.cell}px)` : `translateY(${(d.cur-d.p)*d.cell}px)`;
}
function bkUp(e){
  const d = B && B.drag; if(!d || e.pointerId !== d.id) return;
  B.drag = null;
  const np = Math.round(d.cur);
  bkSet(d.i, np, (d.cur - np) * d.cell);
}
function bkKey2(e){
  const el = e.target.closest && e.target.closest(".bkblk"); if(!el || !B || B.done) return;
  const i = +el.dataset.bk, b = B.blocks[i];
  const dir = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-1, ArrowDown:1}[e.key];
  if(dir === undefined || (b.h !== (e.key==="ArrowLeft"||e.key==="ArrowRight"))) return;
  e.preventDefault();
  const [lo, hi] = bkRange(B.blocks, B.pos, B.walls, i), np = Math.max(lo, Math.min(hi, B.pos[i] + dir));
  bkSet(i, np, 0); el.focus();
}
function bkHintOff(){ document.querySelectorAll(".bkblk.hint").forEach(x=>x.classList.remove("hint")); const g = document.getElementById("bkghost"); if(g) g.hidden = true; }
function bkAction(a){
  if(!B || B.done) return;
  if(a === "undo"){
    if(!B.hist.length){ toast("No hay movimientos para deshacer."); return; }
    const prev = B.hist.pop(), i = prev.findIndex((p,k)=>p !== B.pos[k]);
    const cell = document.getElementById("bkboard").clientWidth/BK_N;
    const from = (B.pos[i] - prev[i]) * cell;
    B.pos = prev; B.moves = Math.max(0, B.moves - 1); bkHintOff();
    const el = document.querySelector(`.bkblk[data-bk="${i}"]`); if(el){ bkPlace(el, B.blocks[i], B.pos[i]); bkAnimate(el, B.blocks[i], from); }
    const m = document.getElementById("bkmoves"); if(m) m.textContent = B.moves;
    return;
  }
  if(a === "reset"){ B.pos = B.start.slice(); B.moves = 0; B.hist = []; bkHintOff(); bkRender(); return; }
  if(a === "hint"){
    const cost = BK_HINT[Math.min(B.hints, BK_HINT.length-1)];
    if(S.coins < cost){ toast(`Necesitás ${cost} monedas para una pista.`); return; }
    const sol = bkSolve(B.blocks, B.pos, B.walls);
    if(!sol || !sol.path.length){ toast("No encontré una pista desde acá. Probá reiniciar."); return; }
    S.coins -= cost; B.hints++; save();
    const c = document.querySelector(".coins .num"); if(c) c.textContent = S.coins;
    const hc = document.getElementById("bkhcost"); if(hc) hc.textContent = BK_HINT[Math.min(B.hints, BK_HINT.length-1)];
    const [bi, bp] = sol.path[0], b = B.blocks[bi];
    bkHintOff();
    const el = document.querySelector(`.bkblk[data-bk="${bi}"]`); if(el) el.classList.add("hint");
    const g = document.getElementById("bkghost");
    if(g){ g.hidden = false; g.style.width = el.style.width; g.style.height = el.style.height; bkPlace(g, b, bp); }
    const msg = document.getElementById("bkmsg");
    if(msg) msg.innerHTML = `Pista: mové el bloque marcado hasta la silueta punteada. Desde acá se resuelve en <b>${sol.moves}</b> ${sol.moves===1?"movimiento":"movimientos"}.`;
  }
}
function bkWin(){
  B.done = true;
  const red = document.querySelector(".bkblk.red");
  const cell = document.getElementById("bkboard").clientWidth/BK_N;
  if(red){ red.classList.add("out"); red.style.transform = `translateX(${cell*2.6}px)`; }
  beep(880,.12); setTimeout(()=>beep(1175,.15),130);
  timers.push(setTimeout(bkEnd, 650));
}
function bkEnd(){
  clearTimers();
  const stars = bkStars(B.moves, B.min, B.hints), prev = S.games.bloques[B.L]||0;
  const coins = stars*3 + (prev?0:5) + Math.floor(B.L/10), xp = (10 + B.min*3)*stars + (prev?0:20);
  if(stars > prev) S.games.bloques[B.L] = stars;
  S.coins += coins; S.xp += xp; save();
  $app.innerHTML = `${topBar("blevels")}
  <div class="result mood-good">
    <div class="verdict">
      <h1>¡Bloque liberado!</h1>
      <p>En <b class="num">${B.moves}</b> ${B.moves===1?"movimiento":"movimientos"}${B.hints?` y ${B.hints} ${B.hints===1?"pista":"pistas"}`:""}. El mínimo era <b class="num">${B.min}</b>.</p>
      <div class="stars" aria-label="${stars} de 3 estrellas">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>
      ${B.moves === B.min ? `<p><b>¡Perfecto! Lo resolviste con la menor cantidad de movimientos posible.</b></p>` : ""}
    </div>
    <div class="gains"><span><span class="coin"></span>+<span class="num">${coins}</span></span><span>+<span class="num">${xp}</span> XP</span></div>
    <p class="hint">3 estrellas con ${B.min} movimientos, 2 con hasta ${B.min + Math.max(2, Math.ceil(B.min*.5))}. Con pistas, máximo 2.</p>
    <div class="actions">
      <button class="btn primary" data-blv="${B.L+1}">Nivel ${B.L+1}</button>
      <button class="btn" data-blv="${B.L}">Jugar de nuevo</button>
      <button class="btn" data-go="blevels">Ver niveles</button>
    </div>
  </div>`;
  confetti();
}


/* ---------- micrófono ---------- */
let rec=null;
const WORDS = {cero:0,uno:1,un:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50};
function parseSpoken(t){
  t = t.toLowerCase();
  const neg = /menos|negativo/.test(t);
  const m = t.replace(/\./g,"").match(/\d+/);
  let n = m ? +m[0] : null;
  if(n===null){ for(const w of t.split(/\s+/)) if(w in WORDS){ n = WORDS[w]; break; } }
  if(n===null) return null;
  return neg ? -n : n;
}
// modo voz: si el jugador usa el micrófono, la app no vuelve a poner el cursor en el campo de texto
// (así no se abre el teclado del celular). Si toca el campo para escribir, vuelve el modo teclado.
let voiceMode = false;
function refocus(inp){ if(!inp) return; if(voiceMode) inp.blur(); else inp.focus(); }
document.addEventListener("pointerdown", e => { if(e.target && e.target.matches && e.target.matches("#wguess, #mguess")) voiceMode = false; }, true);
function startMic(btn, onAlts, idle, listening){
  voiceMode = true;
  try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){}
  idle = idle || "Escribí el resultado o tocá el micrófono"; listening = listening || "Escuchando… decí el número";
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Este navegador no permite dictar. Usá el teclado."); return; }
  try{
    rec = new SR(); rec.lang="es-AR"; rec.interimResults=false; rec.maxAlternatives=3;
    rec.onresult = e => {
      if(onAlts){ onAlts([...e.results[0]].map(a=>a.transcript)); return; }
      for(const alt of e.results[0]){ const n = parseSpoken(alt.transcript); if(n!==null){ setInput(String(n)); finish(n); return; } }
      toast("No entendí el número. Probá de nuevo.");
    };
    rec.onerror = () => toast("No se pudo usar el micrófono en esta vista. Usá el teclado.");
    rec.onend = () => { btn && btn.classList.remove("on"); rec=null; micStatus(idle); };
    rec.start(); btn.classList.add("on"); micStatus(listening);
  }catch(e){ toast("No se pudo usar el micrófono en esta vista. Usá el teclado."); }
}
function micStatus(t){ const m=document.getElementById("micst"); if(m) m.textContent=t; }
function stopMic(){ try{ rec && rec.abort(); }catch(e){} rec=null; }

/* ---------- eventos ---------- */
$app.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t || t.disabled) return;
  if(t.dataset.go){ const g=t.dataset.go; g==="home"?home(): g==="wlevels"?wlevels(): g==="mlevels"?mlevels(): g==="daily"?dailyScreen(): g==="secuencia"?sqScreen(): g==="blevels"?blevels():levels(); return; }
  if(t.dataset.blv){ bplay(+t.dataset.blv); return; }
  if(t.dataset.bka){ bkAction(t.dataset.bka); return; }
  if(t.dataset.sqa){ sqAction(t.dataset.sqa); return; }
  if(t.dataset.mlv){ mplay(+t.dataset.mlv); return; }
  if(t.dataset.mhelp!==undefined || t.dataset.mgive!==undefined || t.dataset.mmic!==undefined){ mAction(t); return; }
  if(t.dataset.daily){ dailyAction(t.dataset.daily); return; }
  if(t.dataset.howto){ howTo(t.dataset.howto); return; }
  if(t.dataset.wlv){ wplay(+t.dataset.wlv); return; }
  if(t.dataset.wpractice){ wPractice(+t.dataset.wpractice); return; }
  if(t.dataset.whelp!==undefined){ wHint(); return; }
  if(t.dataset.wgive!==undefined){ wGiveUp(t); return; }
  if(t.dataset.duel!==undefined){ duelAction(t.dataset.duel, t); return; }
  if(t.dataset.wmic!==undefined){ rec?stopMic():startMic(t, alts=>{ const w=(alts[0]||"").trim().split(/\s+/).pop()||""; const inp=document.getElementById("wguess"); if(inp) inp.value=w; wGuess(w); }, "Escribí una palabra o tocá el micrófono", "Escuchando… decí una palabra"); return; }
  if(t.dataset.lv){ play(+t.dataset.lv); return; }
  if(!G || G.phase!=="answer") { if(t.dataset.help==="replay"){} return; }
  if(t.dataset.help){ useHelp(t.dataset.help); return; }
  if(t.dataset.pick!==undefined){ finish(+t.dataset.pick); return; }
  const k = t.dataset.key; if(k===undefined) return;
  if(k==="ok"){ if(G.input!==""&&G.input!=="-") finish(+G.input); return; }
  if(k==="del"){ setInput(G.input.slice(0,-1)); return; }
  if(k==="clr"){ setInput(""); return; }
  if(k==="neg"){ setInput(G.input.startsWith("-")?G.input.slice(1):"-"+G.input); return; }
  if(k==="mic"){ rec?stopMic():startMic(t); return; }
  if(G.input.replace("-","").length<7) setInput(G.input+k);
});
document.addEventListener("keydown", e => {
  if(!G || G.phase!=="answer" || G.choices) return;
  if(/^\d$/.test(e.key)) setInput(G.input+e.key);
  else if(e.key==="Backspace") setInput(G.input.slice(0,-1));
  else if(e.key==="-") setInput(G.input.startsWith("-")?G.input.slice(1):"-"+G.input);
  else if(e.key==="Enter" && G.input!=="" && G.input!=="-") finish(+G.input);
});

home();
duelFromHash() || dailyFromHash();
})();
