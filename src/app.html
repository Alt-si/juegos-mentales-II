<title>Mente Despierta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&family=Azeret+Mono:wght@500;700&display=swap">
<style>
/* Layout: una sola columna tipo app (máx 480px), pantallas que se reemplazan; el número en juego domina la pantalla. */
:root{
  --bg:#E9EDF5; --surface:#FFFFFF; --ink:#141A2B; --muted:#5B6479; --line:#D3D9E6;
  --accent:#2343D6; --accent-ink:#FFFFFF; --coin:#D99A0B; --good:#18A156; --bad:#E0352B; --warn:#F2B705; --on-warn:#2A1E00; --on-mood:#FFFFFF;
  --lock:#C7CEDC;
  --c1:#FF6A3D; --c1b:#FF9F1C; --c2:#7B3FF2; --c2b:#E04BC9; --c3:#00A88F; --c3b:#3DCCF2; --c4:#FF4F8B; --c5:#FFC233; --ink-on:#FFFFFF;
  --f-display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#161D33; --ink:#E8ECF7; --muted:#9AA4BE; --line:#28314C;
  --accent:#6A84FF; --accent-ink:#0D1222; --coin:#F2B531; --good:#2FD27A; --bad:#FF5A4E; --warn:#FFCB2E; --lock:#2C3552;
  --c1:#FF7A4D; --c1b:#FFB02E; --c2:#8F5CFF; --c2b:#F05BD6; --c3:#17C2A6; --c3b:#4FD5FF; --c4:#FF6B9E; --c5:#FFCF4D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D33; --ink:#E8ECF7; --muted:#9AA4BE; --line:#28314C;
  --accent:#6A84FF; --accent-ink:#0D1222; --coin:#F2B531; --good:#2FD27A; --bad:#FF5A4E; --warn:#FFCB2E; --lock:#2C3552;
  --c1:#FF7A4D; --c1b:#FFB02E; --c2:#8F5CFF; --c2b:#F05BD6; --c3:#17C2A6; --c3b:#4FD5FF; --c4:#FF6B9E; --c5:#FFCF4D;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:480px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:18px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* barra superior */
.top{display:flex;align-items:center;gap:12px}
.top .back{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;flex:none}
.rank{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rank-name{font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-name small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
.coins{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:7px 12px 7px 8px;border-radius:999px;font-weight:700;flex:none}
.coin{width:18px;height:18px;border-radius:50%;background:var(--coin);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);display:inline-block}

/* inicio */
.hello h1{font-size:34px;font-weight:800;letter-spacing:-.01em}
.hello p{margin:6px 0 0;color:var(--muted);max-width:40ch}
/* portada */
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:4px}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,12vw,58px);line-height:1;letter-spacing:-.01em;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.28em}
.logo .lw{display:inline-flex}
.logo .lw > span{display:inline-block;animation:bob 3s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-3px) rotate(-2deg)}}
.brand p{margin:0;color:var(--muted);font-size:16px;font-weight:500;max-width:32ch;text-wrap:balance}
.daycard{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:var(--ink-on);text-align:left;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(135deg, var(--c3), var(--c3b));box-shadow:0 14px 30px color-mix(in srgb, var(--c3) 35%, transparent)}
.daycard::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16)}
.daycard .kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.daycard h2{font-size:30px;font-weight:700;position:relative}
.daycard p{margin:0;opacity:.95;position:relative}
.daycard .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative}
.daycard .go{background:var(--ink-on);color:var(--c3);font-weight:700;border-radius:14px;padding:12px 18px;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:22px;margin:6px 0 -6px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{position:relative;overflow:hidden;border-radius:24px;padding:16px;min-height:178px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;color:var(--ink-on);
  background:linear-gradient(150deg, var(--g1), var(--g2));box-shadow:0 10px 24px color-mix(in srgb, var(--g1) 32%, transparent);transition:transform .15s}
.game:active{transform:scale(.97)}
.game.g-cadena{--g1:var(--c1);--g2:var(--c1b)}
.game.g-palabra{--g1:var(--c2);--g2:var(--c2b)}
.game .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;background:rgba(255,255,255,.95);color:var(--g1);transform:rotate(-6deg);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.game h3{font-size:22px;font-weight:700}
.game p{margin:2px 0 0;font-size:13px;opacity:.95;line-height:1.35}
.game .prog{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.game .prog .pbar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden}
.game .prog .pbar i{display:block;height:100%;background:var(--ink-on);border-radius:6px}
.game .bubble{position:absolute;right:-26px;bottom:-26px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.game.g-mayor{--g1:var(--c4);--g2:var(--c5)}
.game.wide{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.game.wide > div:last-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mpts{position:relative;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-radius:18px;padding:10px 14px;background:var(--surface);border:2px solid var(--c4)}
.mpts span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mpts b{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--c4);line-height:1}
.mpts small{flex-basis:100%;font-size:12px;color:var(--muted)}
.mpts.low{border-color:var(--bad)} .mpts.low b{color:var(--bad)}
.mminus{position:absolute;right:16px;top:8px;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--bad)!important;letter-spacing:0!important;animation:minus .9s ease-out forwards}
@keyframes minus{from{transform:none;opacity:1}to{transform:translateY(-24px);opacity:0}}
.mscore{display:flex;flex-direction:column;align-items:center}
.mscore b{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;color:var(--ink)}
.mscore span{font-size:13px;color:var(--muted)}
.mtotal{margin:6px 0 0;font-weight:600}
.mtotal b{color:var(--c4);font-size:18px}
.mplay{display:flex;flex-direction:column;gap:12px}
.mq{border-radius:22px;padding:16px;color:var(--ink-on);background:linear-gradient(135deg, var(--c4), var(--c5));display:flex;flex-direction:column;gap:6px}
.mq .kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.mq h2{font-size:23px;font-weight:600;line-height:1.2}
.mq p{margin:0;font-size:14px;opacity:.95}
.mrange{display:flex;flex-direction:column;gap:6px}
.mtrack{position:relative;height:18px;border-radius:999px;background:var(--line)}
.mzone{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg, var(--c4), var(--c5));transition:left .4s, width .4s}
.mk{position:absolute;top:-4px;width:4px;height:26px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.mk.hint{background:var(--muted)}
.mends{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.mends .num{font-weight:700;color:var(--ink)}
.mfeed{display:flex;align-items:center;gap:14px;border-radius:20px;padding:14px;background:var(--surface);border:2px solid var(--line)}
.mfeed .arrow{width:60px;height:60px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:32px;font-weight:700;background:var(--bg);color:var(--muted)}
.mfeed div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mfeed b{font-family:var(--f-display);font-size:21px;font-weight:600}
.mfeed span{color:var(--muted);font-size:14px}
.mfeed.t-good,.mfeed.t-warn,.mfeed.t-bad{border-color:var(--tc)}
.mfeed.t-good .arrow,.mfeed.t-warn .arrow,.mfeed.t-bad .arrow{background:var(--tc);color:var(--on-tc)}
.mfeed.pop{animation:land .35s cubic-bezier(.2,1.5,.4,1) both}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:10px;height:44px;border-radius:14px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc)}
.mrow .num{font-weight:700;font-size:16px;flex:1}
.mdir{font-weight:600;font-size:14px}
.mfact{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--muted);text-align:left;width:100%;box-sizing:border-box}
.wordball small{font-size:.45em;font-weight:600}
.mchip b{background:var(--tc)!important;color:var(--on-tc)!important}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.howbtn{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;
  background:var(--surface);color:var(--accent);border:2px solid currentColor;box-shadow:0 3px 0 color-mix(in srgb, currentColor 25%, transparent)}
.howbtn:active{transform:translateY(2px);box-shadow:none}
.gwrap{position:relative;display:flex}
.gwrap > .game,.gwrap > .daycard{flex:1;min-width:0}
.gwrap.wide{grid-column:1 / -1}
.gwrap .daycard .kicker,.gwrap .game.wide h3{padding-right:46px}
.gwrap > .howbtn{position:absolute;top:12px;right:12px;z-index:2;background:rgba(255,255,255,.95);border:0;color:#2A2440}
.hud .howbtn{width:28px;height:28px;font-size:16px;border-width:2px}
.hudr{display:flex;align-items:center;gap:8px}
.howwrap{position:fixed;inset:0;z-index:30;background:rgba(13,18,34,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.howsheet{width:100%;max-width:480px;max-height:calc(100% - env(safe-area-inset-top, 0px) - 16px);overflow:auto;background:var(--surface);color:var(--ink);border-radius:26px;
  padding:0 18px 18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;animation:sheetup .3s cubic-bezier(.2,1.2,.4,1) both}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.howhead{margin:0 -18px;padding:20px 18px 18px;border-radius:26px 26px 0 0;color:var(--ink-on);background:linear-gradient(135deg, var(--hc), color-mix(in srgb, var(--hc) 60%, #FFC233));display:flex;flex-direction:column;gap:4px}
.howkicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.howhead h2{font-size:28px;font-weight:700}
.howhead p{margin:0;opacity:.95}
.howsteps{list-style:none;counter-reset:st;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.howsteps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;line-height:1.4}
.howsteps li::before{content:counter(st);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hc);color:var(--ink-on);font-family:var(--f-display);font-weight:700;font-size:17px}
.howsheet h3{font-size:16px;font-weight:600;margin-top:4px}
.howtips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted);line-height:1.4}
.howok{background:var(--hc)!important;border-color:var(--hc)!important;color:var(--ink-on)!important}
@media (prefers-reduced-motion: reduce){.howsheet{animation:none}}
.soon{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.soon div{border:2px dashed var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px}
.soon b{font-family:var(--f-display);font-size:17px;font-weight:600}
.soon span{font-size:12px;color:var(--muted)}
.soon .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
@media (max-width:360px){.games,.soon{grid-template-columns:1fr}}
/* palabra del día */
.dhero{border-radius:26px;padding:20px;color:var(--ink-on);background:linear-gradient(135deg, var(--c3), var(--c3b));display:flex;flex-direction:column;gap:8px}
.dhero .kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.dhero h1{font-size:32px;font-weight:700}
.dhero p{margin:0;opacity:.95}
.dtoday{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.18);border-radius:18px;padding:12px 14px;margin-top:6px}
.dtoday .btn,.dtoday .btn.primary{height:46px;padding:0 16px;border:0;background:var(--ink-on);color:var(--c3)}
.dtoday .btn:not(.primary){background:rgba(255,255,255,.25);color:var(--ink-on)}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dstats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.dstats b{font-size:22px;color:var(--c3)}
.dstats span{font-size:11px;color:var(--muted);line-height:1.2}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead h2{font-size:20px;font-weight:600}
.calnav{width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:22px;font-weight:700}
.calnav:disabled{opacity:.3;cursor:default}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cdow{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cday{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:700;font-size:14px;line-height:1.05;background:var(--bg)}
.cday small{font-size:10px;font-weight:700;opacity:.9}
.cday.off{opacity:.35}
.cday.miss{border:2px dashed var(--line);background:transparent}
.cday.won{background:var(--good);color:var(--on-mood)}
.cday.lost{background:var(--bad);color:var(--on-mood)}
.cday.today{background:var(--c3);color:var(--ink-on);animation:glowday 1.6s ease-in-out infinite}
.cday.is-today{outline:3px solid var(--c3);outline-offset:2px}
@keyframes glowday{50%{box-shadow:0 0 0 6px color-mix(in srgb, var(--c3) 25%, transparent)}}
.cl-miss i{background:transparent!important;border:2px dashed var(--line)}
.dnotif{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.dnotif span{color:var(--muted);font-size:13px}
.dnotif .btn{height:44px;padding:0 18px}
.dnotif .btn.primary{background:var(--c3);border-color:var(--c3);color:var(--ink-on)}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* mapa de niveles */
.stage{display:flex;flex-direction:column;gap:10px}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage-head h2{font-size:20px}
.stage-head span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-num);font-weight:700;font-size:17px}
.lv .st{font-size:10px;letter-spacing:1px;color:var(--coin);height:12px}
.lv.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lv.lock{background:transparent;color:var(--lock);border-style:dashed;cursor:default}
.levels{display:flex;flex-direction:column;gap:26px}

/* juego */
.play{flex:1;display:flex;flex-direction:column;gap:16px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.hud b{color:var(--ink);font-family:var(--f-num)}
.stagebox{flex:1;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.big{font-family:var(--f-num);font-weight:700;font-size:clamp(72px,24vw,128px);line-height:1;letter-spacing:-.04em;display:flex;align-items:baseline;gap:.12em}
.big .op{color:var(--accent);font-size:.6em}
.big.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.82);opacity:.2}to{transform:none;opacity:1}}
.disc{width:clamp(150px,52vw,208px);height:clamp(150px,52vw,208px);border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:7px solid var(--accent);color:var(--ink);font-size:clamp(64px,22vw,96px);letter-spacing:-.04em;
  box-shadow:0 0 0 10px color-mix(in srgb, var(--accent) 14%, transparent), 0 14px 34px color-mix(in srgb, var(--accent) 30%, transparent)}
.disc.len3{font-size:clamp(48px,16vw,72px)}
.disc.len4{font-size:clamp(38px,13vw,56px)}
.micbtn{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent), 0 8px 20px color-mix(in srgb, var(--accent) 35%, transparent)}
.micbtn:active{transform:scale(.95)}
.micbtn.on{background:var(--bad);color:var(--on-mood);animation:listen 1.1s ease-in-out infinite}
@keyframes listen{50%{box-shadow:0 0 0 16px color-mix(in srgb, var(--bad) 22%, transparent), 0 8px 24px color-mix(in srgb, var(--bad) 40%, transparent)}}
.cue{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,12vw,52px);letter-spacing:-.01em;color:var(--muted)}
.cue.go{color:var(--accent);font-size:clamp(48px,15vw,64px)}
.opsign{font-family:var(--f-num);font-weight:700;font-size:clamp(90px,30vw,140px);line-height:1;color:var(--accent)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.hint{color:var(--muted);font-size:13px;text-align:center}

<script>
(function(){
const TOTAL_LEVELS = Infinity;   // los niveles no se terminan: la dificultad sigue subiendo
const ANSWER_TIME = 10;
const RANKS = [
  ["Novato",0],["Aprendiz",400],["Contador",1200],["Calculista",3000],["Veloz",6500],
  ["Experto",12000],["Maestro",22000],["Gran Maestro",40000],["Leyenda",75000],["Mente Infinita",130000]
];
const HELPS = {
  replay:{name:"Repetir", cost:30},
  time:{name:"+5 seg", cost:20},
  choices:{name:"3 opciones", cost:40}
};

/* ---------- guardado ---------- */
let S = {coins:100, xp:0, games:{cadena:{}}};
try{ const raw = localStorage.getItem("mentecuenta"); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
S.games = Object.assign({cadena:{}, escondida:{}}, S.games);
function save(){ try{ localStorage.setItem("mentecuenta", JSON.stringify(S)); }catch(e){} }

function rankInfo(){
  let i = 0; while(i < RANKS.length-1 && S.xp >= RANKS[i+1][1]) i++;
  const cur = RANKS[i], nxt = RANKS[i+1];
  const pct = nxt ? (S.xp-cur[1])/(nxt[1]-cur[1])*100 : 100;
  return {name:cur[0], n:i+1, pct, next:nxt};
}
const cleared = () => S.games.cadena;
function highest(store){ store = store || cleared(); let h=0; for(const k in store) h=Math.max(h,+k); return h; }

/* ---------- generador de niveles ---------- */
function cfg(L){
  return {
    count: L<=300 ? Math.min(3 + Math.floor((L-1)/7), 20) : Math.min(30, 20 + Math.floor((L-300)/40)),
    max: L<=10?9 : L<=30?15 : L<=60?25 : L<=110?50 : L<=180?99 : L<=240?250 : L<=400?999 : L<=600?2500 : 9999,
    min: L>110?10 : 1,
    ops: L<=5?["+"] : L<=40?["+","-"] : L<=90?["+","-","×"] : ["+","-","×","÷"],
    speed: L<=300 ? Math.max(520, 1650 - L*6) : Math.max(380, 520 - Math.floor((L-300)/5)),
    neg: L>70
  };
}
// generador con semilla: con la misma semilla salen las mismas cuentas (para los duelos)
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RAND = Math.random;
const rnd = (a,b)=> a + Math.floor(RAND()*(b-a+1));
function genLevel(L, seed){
  RAND = seed ? mulberry32(seed) : Math.random;
  try{ return genLevelRaw(L); } finally { RAND = Math.random; }
}
function genLevelRaw(L){
  const c = cfg(L);
  let total = rnd(Math.max(c.min,2), c.max);
  const items = [{op:"", n:total}];
  for(let i=1;i<c.count;i++){
    let op = c.ops[rnd(0,c.ops.length-1)], n;
    if(op==="×" && (Math.abs(total)>150 || total===0)) op="+";
    if(op==="÷"){
      const ds=[]; for(let d=2; d<=12; d++) if(total!==0 && total%d===0 && Math.abs(total)/d>=2) ds.push(d);
      if(ds.length){ n = ds[rnd(0,ds.length-1)]; total/=n; items.push({op,n}); continue; }
      op="-";
    }
    if(op==="×"){ n = rnd(2, L>200?12:9); total*=n; items.push({op,n}); continue; }
    if(op==="-" && !c.neg){
      if(total < 2){ op="+"; } else { n = rnd(1, Math.min(c.max,total)); total-=n; items.push({op,n}); continue; }
    }
    n = rnd(c.min, c.max);
    total = op==="+" ? total+n : total-n;
    items.push({op,n});
  }
  return {items, answer: total, cfg:c};
}
function stageLabel(s){
  const L = s*20+1, c = cfg(L), c2 = cfg(L+19);
  const ops = c2.ops.join(" ");
  return `${c.count}–${c2.count} números · hasta ${c2.max} · ${ops}`;
}
const STAGE_NAMES = ["Primeros pasos","Calentando","Restas en juego","Ritmo","Doble dígito","Entra el ×","Cadena larga","Sin red","Todo vale","Cuatro operaciones","Centenas","Velocidad","Mente fría","Elite","Leyenda","Miles","Turbo","Sin respiro","Maratón","Mente de acero"];

/* ---------- utilidades ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
let actx=null;
function beep(f=660,d=.06){ try{ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; g.gain.value=.06; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
function fmt(n){ return n<0 ? "−"+Math.abs(n) : String(n); }

function topBar(back){
  const r = rankInfo();
  return `<div class="top">
    ${back?`<button class="back" data-go="${back}" aria-label="Volver">←</button>`:""}
    <div class="rank">
      <div class="rank-name">${esc(r.name)}<small>Rango ${r.n} · <span class="num">${S.xp}</span> XP</small></div>
      <div class="bar"><i style="width:${r.pct}%"></i></div>
    </div>
    <div class="coins"><span class="coin"></span><span class="num">${S.coins}</span></div>
  </div>`;
}

/* ---------- pantallas ---------- */
let timers = [];
function clearTimers(){ const cf=document.getElementById("confetti"); if(cf) cf.remove(); timers.forEach(t=>{clearTimeout(t);clearInterval(t)}); timers=[]; stopMic(); }

function home(){
  clearTimers();
  const hc = highest(), hw = highest(S.games.escondida), hm = highest(S.games.mayor);
  const st = dailyStatus();
  let li = 0;
  const logo = "Mente Despierta".split(" ").map(w=>`<span class="lw">${[...w].map(c=>{ const i = li++; return `<span style="--i:${i};color:var(--c${i%5+1})">${c}</span>`; }).join("")}</span>`).join(" ");
  $app.innerHTML = `${topBar()}
  <div class="brand"><h1 class="logo" aria-label="Mente Despierta">${logo}</h1><p>Entrená la cabeza jugando un ratito por día.</p></div>
  <div class="gwrap">${howBtn("dia")}
  <button class="daycard" data-go="daily">
    <span class="kicker">Desafío del día · ${prettyDay(st.k)}</span>
    <h2>Palabra del día</h2>
    <p>${st.r ? (st.r.ok ? `¡La encontraste en ${st.r.t} ${st.r.t===1?"intento":"intentos"}! Mañana hay otra.` : "Hoy no salió. Mañana hay una palabra nueva.") : "Una palabra nueva, la misma para todos. ¿La descubrís?"}</p>
    <div class="row">
      <span class="chip">Racha: <b class="num">${st.streak}</b> ${st.streak===1?"día":"días"}</span>
      <span class="go">${st.r ? "Ver calendario" : "Jugar ahora"}</span>
    </div>
  </button></div>
  <h2 class="sec-title">Juegos</h2>
  <div class="games">
    <div class="gwrap">${howBtn("cadena")}<button class="game g-cadena" data-go="levels">
      <span class="bubble"></span>
      <div class="ic">5+6</div>
      <div><h3>Cadena</h3><p>Sumá, restá y multiplicá de cabeza mientras pasan los números.</p></div>
      <div class="prog"><span class="pbar"><i style="width:${hc%20/20*100}%"></i></span><span class="num">Nivel ${hc+1}</span></div>
    </button></div>
    <div class="gwrap">${howBtn("palabra")}<button class="game g-palabra" data-go="wlevels">
      <span class="bubble"></span>
      <div class="ic">A?</div>
      <div><h3>Palabra escondida</h3><p>Probá palabras y acercate a la secreta.</p></div>
      <div class="prog"><span class="pbar"><i style="width:${hw%20/20*100}%"></i></span><span class="num">Nivel ${hw+1}</span></div>
    </button></div>
  </div>
    <div class="gwrap wide">${howBtn("mayor")}<button class="game g-mayor wide" data-go="mlevels">
      <span class="bubble"></span>
      <div class="ic">↑↓</div>
      <div><h3>Mayor o menor</h3><p>Adiviná el dato: años, metros, cantidades. Te decimos si es más o menos.</p>
      <div class="prog"><span class="pbar"><i style="width:${hm%20/20*100}%"></i></span><span class="num">Nivel ${hm+1} · ${mFmt(mTotal())} pts</span></div></div>
    </button></div>
  </div>
  <h2 class="sec-title">Muy pronto</h2>
  <div class="soon">
    <div><span class="dot" style="--c:var(--c4)"></span><b>Tablas relámpago</b><span>Multiplicaciones contra reloj</span></div>
    <div><span class="dot" style="--c:var(--c5)"></span><b>Y más juegos</b><span>Estamos preparando nuevos desafíos</span></div>
  </div>
  <p class="note">Tu progreso se guarda en este dispositivo.</p>`;
}

function levelMap(o){
  clearTimers();
  const h = highest(o.store); const stages = Math.ceil(o.total/20);
  let html = `${topBar("home")}<div class="hello"><div class="titlerow"><h1>${o.title}</h1>${o.how?howBtn(o.how):""}</div><p>${o.desc}</p></div><div class="levels">`;
  for(let s=0;s<stages;s++){
    if(s*20+1 > h+21 && s>0){ html += `<div class="stage"><div class="stage-head"><h2>${isFinite(stages)?`Etapa ${s+1} a ${stages}`:`Etapa ${s+1} y más`}</h2><span>${isFinite(stages)?"Se desbloquean a medida que avanzás":"Los niveles no se terminan nunca: siempre hay uno más"}</span></div></div>`; break; }
    html += `<div class="stage"><div class="stage-head"><h2>Etapa ${s+1} · ${o.names[s] || o.names[s % o.names.length] + " " + (Math.floor(s/o.names.length)+1)}</h2><span>${o.label(s)}</span></div><div class="grid">`;
    for(let L=s*20+1; L<=Math.min(o.total, s*20+20); L++){
      const st = o.store[L];
      if(st!==undefined) html += `<button class="lv" data-${o.attr}="${L}">${L}<span class="st">${st?"★".repeat(st):"–"}</span></button>`;
      else if(L===h+1) html += `<button class="lv next" data-${o.attr}="${L}" aria-label="Nivel ${L}, siguiente">${L}<span class="st"></span></button>`;
      else html += `<button class="lv lock" disabled aria-label="Nivel ${L} bloqueado">${L}<span class="st"></span></button>`;
    }
    html += `</div></div>`;
  }
  $app.innerHTML = html + `</div>`;
  const nx = $app.querySelector(".lv.next"); if(nx) nx.scrollIntoView({block:"center"});
  if(o.how) howFirst(o.how);
}
function levels(){
  levelMap({title:"Cadena", desc:"La cuenta se resuelve en orden, como en una calculadora: 5 + 6 × 2 = 22.",
    store:S.games.cadena, total:TOTAL_LEVELS, names:STAGE_NAMES, label:stageLabel, attr:"lv", how:"cadena"});
  addDuelCard("cnew", `Los dos reciben las mismas ${C_ROUNDS} cuentas, del nivel en el que estás. Gana quien acierte más; si empatan, el que respondió más rápido.`);
}

/* ---------- partida ---------- */
let G = null;
function play(L, duel){
  clearTimers();
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  G = Object.assign(genLevel(L, duel ? duel.seed + duel.round*101 : 0), {L, input:"", extra:0, used:{}, phase:"show", duel:duel||null});
  $app.innerHTML = `${topBar("levels")}
  <div class="play">
    <div class="hud">${duel?`<span><b>Duelo</b> · ronda <b>${duel.round+1}</b> de ${C_ROUNDS}${duel.p?` · contra ${esc(duel.p.a.n)}`:""}</span>`:`<span>Nivel <b>${L}</b></span>`}<span><b>${G.items.length}</b> números · ${(G.cfg.speed/1000).toFixed(1)} s cada uno</span></div>
    <div class="stagebox" id="box"></div>
    <div id="bottom"></div>
  </div>`;
  showSequence();
}
function showSequence(){
  G.phase="show";
  const box = document.getElementById("box");
  document.getElementById("bottom").innerHTML = `<p class="hint">Mirá y calculá en tu cabeza…</p>`;
  box.innerHTML = `<div class="big" id="big"><span class="cue">Preparado…</span></div><div class="dots">${G.items.map(()=>"<i></i>").join("")}</div>`;
  const big = document.getElementById("big"); big.style.fontSize="48px";
  let i = 0; const sp = G.cfg.speed;
  const opT = Math.round(sp*0.38);
  const showNum = (it, idx) => {
    const len = String(it.n).length;
    big.style.fontSize="";
    big.innerHTML = `<span class="disc num len${Math.min(len,4)}">${it.n}</span>`;
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    box.querySelectorAll(".dots i")[idx].classList.add("on");
    beep(520 + idx*25);
    const t = idx===0 ? sp : sp-opT;
    timers.push(setTimeout(()=>{ big.innerHTML="&nbsp;"; timers.push(setTimeout(step, 110)); }, t-110));
  };
  const step = () => {
    if(i >= G.items.length){ askAnswer(); return; }
    const it = G.items[i], idx = i; i++;
    if(!it.op){ showNum(it, idx); return; }
    big.style.fontSize="";
    big.innerHTML = `<span class="opsign">${it.op==="-"?"−":it.op}</span>`;
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    beep(330,.04);
    timers.push(setTimeout(()=>showNum(it, idx), opT));
  };
  timers.push(setTimeout(()=>{
    big.style.fontSize="";
    big.innerHTML = `<span class="cue go">¡Listo!</span>`;
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    beep(440,.08);
    timers.push(setTimeout(()=>{ big.innerHTML="&nbsp;"; timers.push(setTimeout(step, 150)); }, 750));
  }, 1100));
}
function askAnswer(){
  G.phase="answer"; G.input=""; G.t0=performance.now();
  const box = document.getElementById("box");
  box.innerHTML = `<p class="hint">¿Cuánto da?</p><div class="answer empty" id="ans">?</div>
    <p class="hint" id="micst">Escribí el resultado o tocá el micrófono</p>
    <div class="timer" id="timer" style="width:100%"><i id="tbar"></i></div>`;
  renderBottom();
  const tick = () => {
    const total = ANSWER_TIME + G.extra;
    const left = total - (performance.now()-G.t0)/1000;
    const tb = document.getElementById("tbar"); if(!tb) return;
    tb.style.width = Math.max(0,left/total*100)+"%";
    document.getElementById("timer").classList.toggle("warn", left<3);
    if(left<=0){ finish(null); }
  };
  timers.push(setInterval(tick, 50));
}
function renderBottom(){
  const b = document.getElementById("bottom");
  const helps = G.duel ? "" : Object.entries(HELPS).map(([k,h])=>`<button class="help" data-help="${k}" ${G.used[k]||S.coins<h.cost?"disabled":""}>${h.name}<small><span class="coin"></span>${h.cost}</small></button>`).join("");
  let main;
  if(G.choices){
    main = `<div class="choices">${G.choices.map(c=>`<button data-pick="${c}" class="num">${fmt(c)}</button>`).join("")}</div>`;
  } else {
    const k = (v,l=v,cls="")=>`<button class="key ${cls}" data-key="${v}">${l}</button>`;
    main = `<div class="pad">
      ${k(1)}${k(2)}${k(3)}${k("del","⌫")}
      ${k(4)}${k(5)}${k(6)}${k("neg","±")}
      ${k(7)}${k(8)}${k(9)}<button class="key mic" data-key="mic" aria-label="Responder por voz"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/><path d="M8.5 21.5h7"/></svg></button>
      ${k(0)}<button class="key ok" data-key="ok" style="grid-column:span 3">Listo</button>
    </div>`;
  }
  b.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">${helps?`<div class="helps">${helps}</div>`:""}${main}</div>`;
}
function setInput(v){
  G.input = v;
  const a = document.getElementById("ans");
  if(a){ a.textContent = v===""||v==="-" ? (v==="-"?"−":"?") : fmt(+v); a.classList.toggle("empty", v===""); }
}
function useHelp(k){
  const h = HELPS[k]; if(G.used[k] || S.coins < h.cost) return;
  S.coins -= h.cost; G.used[k]=true; save();
  document.querySelector(".coins .num").textContent = S.coins;
  if(k==="time"){ G.extra += 5; toast("Tenés 5 segundos más"); renderBottom(); }
  if(k==="choices"){
    const set = new Set([G.answer]);
    while(set.size<3){ const d = rnd(1, Math.max(3, Math.min(12, Math.ceil(Math.abs(G.answer)*.15)))); set.add(G.answer + (Math.random()<.5?-d:d)); }
    G.choices = [...set].sort(()=>Math.random()-.5); renderBottom();
  }
  if(k==="replay"){ clearTimers(); showSequence(); }
}
function finish(val){
  if(G.phase!=="answer") return;
  G.phase="done"; clearTimers();
  const ok = val!==null && val===G.answer;
  const used = (performance.now()-G.t0)/1000, total = ANSWER_TIME+G.extra;
  if(G.duel) return cDuelRound(ok, val, used);
  let stars=0, coins=0, xp=0;
  if(ok){
    stars = used <= total*.4 ? 3 : used <= total*.7 ? 2 : 1;
    if(Object.keys(G.used).length) stars = Math.min(stars, 2);
    const prev = cleared()[G.L]||0;
    coins = stars*3 + (prev?0:5) + Math.floor(G.L/10);
    xp = (8 + G.L) * stars + (prev?0:20);
    if(stars>prev) cleared()[G.L]=stars;
    S.coins += coins; S.xp += xp; save();
    beep(880,.12); setTimeout(()=>beep(1175,.15),130);
  } else beep(220,.25);
  const diff = val===null ? null : val - G.answer;
  const tol = Math.max(2, Math.round(Math.abs(G.answer)*0.1));
  const mood = ok ? "good" : (diff!==null && Math.abs(diff)<=tol) ? "warn" : "bad";
  const title = ok ? "¡Correcto!" : mood==="warn" ? "¡Uy, casi!" : val===null ? "Se acabó el tiempo" : "Incorrecto";
  const sub = ok ? `Respondiste en <b class="num">${used.toFixed(1)}</b> s`
    : mood==="warn" ? `Te ${diff<0?"faltaron":"sobraron"} <b class="num">${Math.abs(diff)}</b>. ¡Estuviste cerca!`
    : val===null ? "No llegaste a responder" : `Te equivocaste por <b class="num">${Math.abs(diff)}</b>`;
  const sym = o => o==="-" ? "−" : o;
  let k = 0, chain = "";
  G.items.forEach((it,i)=>{
    if(it.op) chain += `<span class="sign" style="--i:${k++}">${sym(it.op)}</span>`;
    chain += `<span class="ball" style="--i:${k++}">${it.n}</span>`;
  });
  chain += `<span class="sign eq" style="--i:${k++}">=</span><span class="ball final" style="--i:${k++}">${fmt(G.answer)}</span>`;
  $app.innerHTML = `${topBar("levels")}
  <div class="result mood-${mood}">
    <div class="verdict">
      <h1>${title}</h1>
      <p>${sub}</p>
      <div class="duel">
        <div class="who"><div class="ball hero ${val===null?"empty":""}">${val===null?"?":fmt(val)}</div>Tu respuesta</div>
        ${ok?"":`<div class="who"><div class="ball hero truth">${fmt(G.answer)}</div>Resultado</div>`}
      </div>
      ${ok?`<div class="stars" aria-label="${stars} de 3 estrellas">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>`:""}
    </div>
    ${ok?`<div class="gains"><span><span class="coin"></span>+<span class="num">${coins}</span></span><span>+<span class="num">${xp}</span> XP</span></div>`:""}
    ${ok && Object.keys(G.used).length?`<p class="hint">Con ayudas, el máximo es 2 estrellas.</p>`:""}
    <div class="chainbox"><h2>La cuenta</h2><div class="chain">${chain}</div></div>
    <div class="actions">
      ${ok && G.L<TOTAL_LEVELS?`<button class="btn primary" data-lv="${G.L+1}">Nivel ${G.L+1}</button>`:""}
      <button class="btn ${ok?"":"primary"}" data-lv="${G.L}">${ok?"Repetir nivel":"Intentar de nuevo"}</button>
      <button class="btn" data-go="levels">Ver niveles</button>
    </div>
  </div>`;
  if(ok) confetti();
}

function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.id="confetti"; document.body.appendChild(c);
  const dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight;
  c.width = W*dpr; c.height = H*dpr; const x = c.getContext("2d"); x.scale(dpr,dpr);
  const css = getComputedStyle(document.documentElement);
  const cols = ["--good","--warn","--bad","--accent","--coin"].map(v=>css.getPropertyValue(v).trim());
  const P = Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*80,y:H*.3,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,
    r:4+Math.random()*5,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],round:Math.random()<.4}));
  const t0 = performance.now();
  (function f(t){
    x.clearRect(0,0,W,H);
    for(const p of P){ p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.r/1.6,0,7);x.fill();} else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);
      x.restore(); }
    if(t-t0<2200 && document.body.contains(c)) requestAnimationFrame(f); else c.remove();
  })(t0);
}

/* ---------- micrófono ---------- */
let rec=null;
const WORDS = {cero:0,uno:1,un:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50};
function parseSpoken(t){
  t = t.toLowerCase();
  const neg = /menos|negativo/.test(t);
  const m = t.replace(/\./g,"").match(/\d+/);
  let n = m ? +m[0] : null;
  if(n===null){ for(const w of t.split(/\s+/)) if(w in WORDS){ n = WORDS[w]; break; } }
  if(n===null) return null;
  return neg ? -n : n;
}
// modo voz: si el jugador usa el micrófono, la app no vuelve a poner el cursor en el campo de texto
// (así no se abre el teclado del celular). Si toca el campo para escribir, vuelve el modo teclado.
let voiceMode = false;
function refocus(inp){ if(!inp) return; if(voiceMode) inp.blur(); else inp.focus(); }
document.addEventListener("pointerdown", e => { if(e.target && e.target.matches && e.target.matches("#wguess, #mguess")) voiceMode = false; }, true);
function startMic(btn, onAlts, idle, listening){
  voiceMode = true;
  try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){}
  idle = idle || "Escribí el resultado o tocá el micrófono"; listening = listening || "Escuchando… decí el número";
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Este navegador no permite dictar. Usá el teclado."); return; }
  try{
    rec = new SR(); rec.lang="es-AR"; rec.interimResults=false; rec.maxAlternatives=3;
    rec.onresult = e => {
      if(onAlts){ onAlts([...e.results[0]].map(a=>a.transcript)); return; }
      for(const alt of e.results[0]){ const n = parseSpoken(alt.transcript); if(n!==null){ setInput(String(n)); finish(n); return; } }
      toast("No entendí el número. Probá de nuevo.");
    };
    rec.onerror = () => toast("No se pudo usar el micrófono en esta vista. Usá el teclado.");
    rec.onend = () => { btn && btn.classList.remove("on"); rec=null; micStatus(idle); };
    rec.start(); btn.classList.add("on"); micStatus(listening);
  }catch(e){ toast("No se pudo usar el micrófono en esta vista. Usá el teclado."); }
}
function micStatus(t){ const m=document.getElementById("micst"); if(m) m.textContent=t; }
function stopMic(){ try{ rec && rec.abort(); }catch(e){} rec=null; }

/* ---------- eventos ---------- */
$app.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t || t.disabled) return;
  if(t.dataset.go){ const g=t.dataset.go; g==="home"?home(): g==="wlevels"?wlevels(): g==="mlevels"?mlevels(): g==="daily"?dailyScreen():levels(); return; }
  if(t.dataset.mlv){ mplay(+t.dataset.mlv); return; }
  if(t.dataset.mhelp!==undefined || t.dataset.mgive!==undefined || t.dataset.mmic!==undefined){ mAction(t); return; }
  if(t.dataset.daily){ dailyAction(t.dataset.daily); return; }
  if(t.dataset.howto){ howTo(t.dataset.howto); return; }
  if(t.dataset.wlv){ wplay(+t.dataset.wlv); return; }
  if(t.dataset.wpractice){ wPractice(+t.dataset.wpractice); return; }
  if(t.dataset.whelp!==undefined){ wHint(); return; }
  if(t.dataset.wgive!==undefined){ wGiveUp(t); return; }
  if(t.dataset.duel!==undefined){ duelAction(t.dataset.duel, t); return; }
  if(t.dataset.wmic!==undefined){ rec?stopMic():startMic(t, alts=>{ const w=(alts[0]||"").trim().split(/\s+/).pop()||""; const inp=document.getElementById("wguess"); if(inp) inp.value=w; wGuess(w); }, "Escribí una palabra o tocá el micrófono", "Escuchando… decí una palabra"); return; }
  if(t.dataset.lv){ play(+t.dataset.lv); return; }
  if(!G || G.phase!=="answer") { if(t.dataset.help==="replay"){} return; }
  if(t.dataset.help){ useHelp(t.dataset.help); return; }
  if(t.dataset.pick!==undefined){ finish(+t.dataset.pick); return; }
  const k = t.dataset.key; if(k===undefined) return;
  if(k==="ok"){ if(G.input!==""&&G.input!=="-") finish(+G.input); return; }
  if(k==="del"){ setInput(G.input.slice(0,-1)); return; }
  if(k==="clr"){ setInput(""); return; }
  if(k==="neg"){ setInput(G.input.startsWith("-")?G.input.slice(1):"-"+G.input); return; }
  if(k==="mic"){ rec?stopMic():startMic(t); return; }
  if(G.input.replace("-","").length<7) setInput(G.input+k);
});
document.addEventListener("keydown", e => {
  if(!G || G.phase!=="answer" || G.choices) return;
  if(/^\d$/.test(e.key)) setInput(G.input+e.key);
  else if(e.key==="Backspace") setInput(G.input.slice(0,-1));
  else if(e.key==="-") setInput(G.input.startsWith("-")?G.input.slice(1):"-"+G.input);
  else if(e.key==="Enter" && G.input!=="" && G.input!=="-") finish(+G.input);
});

home();
duelFromHash() || dailyFromHash();
})();
