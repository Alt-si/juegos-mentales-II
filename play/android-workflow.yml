# Compila la app de Android de Mente Despierta (Trusted Web Activity).
# Genera:
#   - mente-despierta-sin-firmar.aab  → se firma con la clave de subida y se sube a Google Play
#   - mente-despierta-prueba.apk      → se instala directo en un celular para probar (firmada con clave de prueba)
# Los archivos quedan en la rama "android-build" y como artefacto de la ejecución.
name: App Android (Google Play)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar AAB y APK de prueba
        run: gradle -p android --no-daemon --stacktrace bundleRelease assembleDebug

      - name: Guardar los archivos en la rama android-build
        run: |
          mkdir -p /tmp/out
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/out/mente-despierta-sin-firmar.aab
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/mente-despierta-prueba.apk
          echo "${GITHUB_SHA}" > /tmp/out/COMMIT
          cd /tmp/out
          git init -q -b android-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Compilación de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-build

      - uses: actions/upload-artifact@v4
        with:
          name: mente-despierta-android
          path: /tmp/out/*
