<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2343D6">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>MenteCuenta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=Azeret+Mono:wght@500;700&display=swap">
<style>
/* Layout: una sola columna tipo app (máx 480px), pantallas que se reemplazan; el número en juego domina la pantalla. */
:root{
  --bg:#E9EDF5; --surface:#FFFFFF; --ink:#141A2B; --muted:#5B6479; --line:#D3D9E6;
  --accent:#2343D6; --accent-ink:#FFFFFF; --coin:#D99A0B; --good:#1F8A4C; --bad:#C2362B;
  --lock:#C7CEDC;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#161D33; --ink:#E8ECF7; --muted:#9AA4BE; --line:#28314C;
  --accent:#6A84FF; --accent-ink:#0D1222; --coin:#F2B531; --good:#45C47C; --bad:#FF6B5E; --lock:#2C3552;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D33; --ink:#E8ECF7; --muted:#9AA4BE; --line:#28314C;
  --accent:#6A84FF; --accent-ink:#0D1222; --coin:#F2B531; --good:#45C47C; --bad:#FF6B5E; --lock:#2C3552;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:480px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:18px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* barra superior */
.top{display:flex;align-items:center;gap:12px}
.top .back{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;flex:none}
.rank{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rank-name{font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-name small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
.coins{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:7px 12px 7px 8px;border-radius:999px;font-weight:700;flex:none}
.coin{width:18px;height:18px;border-radius:50%;background:var(--coin);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);display:inline-block}

/* inicio */
.hello h1{font-size:34px;font-weight:800;letter-spacing:-.01em}
.hello p{margin:6px 0 0;color:var(--muted);max-width:40ch}
.games{display:flex;flex-direction:column;gap:12px}
.game{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.game .ic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:20px;background:var(--bg)}
.game.live .ic{background:var(--accent);color:var(--accent-ink)}
.game h3{font-size:19px}
.game p{margin:2px 0 0;color:var(--muted);font-size:13px}
.game .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.game.live .tag{color:var(--accent)}
.game[disabled]{opacity:.62;cursor:default}
.game .prog{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* mapa de niveles */
.stage{display:flex;flex-direction:column;gap:10px}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage-head h2{font-size:20px}
.stage-head span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-num);font-weight:700;font-size:17px}
.lv .st{font-size:10px;letter-spacing:1px;color:var(--coin);height:12px}
.lv.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lv.lock{background:transparent;color:var(--lock);border-style:dashed;cursor:default}
.levels{display:flex;flex-direction:column;gap:26px}

/* juego */
.play{flex:1;display:flex;flex-direction:column;gap:16px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.hud b{color:var(--ink);font-family:var(--f-num)}
.stagebox{flex:1;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.big{font-family:var(--f-num);font-weight:700;font-size:clamp(72px,24vw,128px);line-height:1;letter-spacing:-.04em;display:flex;align-items:baseline;gap:.12em}
.big .op{color:var(--accent);font-size:.6em}
.big.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.82);opacity:.2}to{transform:none;opacity:1}}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.hint{color:var(--muted);font-size:13px;text-align:center}
.timer{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--good);width:100%}
.timer.warn i{background:var(--bad)}
.answer{font-family:var(--f-num);font-weight:700;font-size:56px;min-height:64px;text-align:center;letter-spacing:-.02em}
.answer.empty{color:var(--line)}
.helps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.help{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:600}
.help small{display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.help small .coin{width:12px;height:12px}
.help:disabled{opacity:.4;cursor:default}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-num);font-size:22px;font-weight:700}
.key:active{transform:translateY(1px)}
.key.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--f-body);font-size:17px}
.key.mic{font-family:var(--f-body);font-size:14px}
.key.mic.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choices button{height:64px;border-radius:14px;background:var(--surface);border:2px solid var(--accent);font-family:var(--f-num);font-size:24px;font-weight:700}

/* resultado */
.result{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center;text-align:center;align-items:center}
.result h1{font-size:40px;font-weight:800}
.result .stars{font-size:40px;letter-spacing:6px;color:var(--coin)}
.result .stars .off{color:var(--line)}
.seq{font-family:var(--f-num);font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;word-break:break-word;max-width:100%}
.gains{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gains span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;display:flex;align-items:center;gap:6px}
.actions{display:flex;flex-direction:column;gap:10px;width:100%}
.btn{height:54px;border-radius:16px;font-weight:700;font-size:16px;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
@media (prefers-reduced-motion: reduce){.big.pop{animation:none}.bar i{transition:none}}
</style>

<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const TOTAL_LEVELS = 300;
const ANSWER_TIME = 10;
const RANKS = [
  ["Novato",0],["Aprendiz",400],["Contador",1200],["Calculista",3000],["Veloz",6500],
  ["Experto",12000],["Maestro",22000],["Gran Maestro",40000],["Leyenda",75000],["Mente Infinita",130000]
];
const HELPS = {
  replay:{name:"Repetir", cost:30},
  time:{name:"+5 seg", cost:20},
  choices:{name:"3 opciones", cost:40}
};

/* ---------- guardado ---------- */
let S = {coins:100, xp:0, games:{cadena:{}}};
try{ const raw = localStorage.getItem("mentecuenta"); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem("mentecuenta", JSON.stringify(S)); }catch(e){} }

function rankInfo(){
  let i = 0; while(i < RANKS.length-1 && S.xp >= RANKS[i+1][1]) i++;
  const cur = RANKS[i], nxt = RANKS[i+1];
  const pct = nxt ? (S.xp-cur[1])/(nxt[1]-cur[1])*100 : 100;
  return {name:cur[0], n:i+1, pct, next:nxt};
}
const cleared = () => S.games.cadena;
function highest(){ let h=0; for(const k in cleared()) h=Math.max(h,+k); return h; }

/* ---------- generador de niveles ---------- */
function cfg(L){
  return {
    count: Math.min(3 + Math.floor((L-1)/7), 20),
    max: L<=10?9 : L<=30?15 : L<=60?25 : L<=110?50 : L<=180?99 : L<=240?250 : 999,
    min: L>110?10 : 1,
    ops: L<=5?["+"] : L<=40?["+","-"] : L<=90?["+","-","×"] : ["+","-","×","÷"],
    speed: Math.max(520, 1650 - L*6),
    neg: L>70
  };
}
const rnd = (a,b)=> a + Math.floor(Math.random()*(b-a+1));
function genLevel(L){
  const c = cfg(L);
  let total = rnd(Math.max(c.min,2), c.max);
  const items = [{op:"", n:total}];
  for(let i=1;i<c.count;i++){
    let op = c.ops[rnd(0,c.ops.length-1)], n;
    if(op==="×" && (Math.abs(total)>150 || total===0)) op="+";
    if(op==="÷"){
      const ds=[]; for(let d=2; d<=12; d++) if(total!==0 && total%d===0 && Math.abs(total)/d>=2) ds.push(d);
      if(ds.length){ n = ds[rnd(0,ds.length-1)]; total/=n; items.push({op,n}); continue; }
      op="-";
    }
    if(op==="×"){ n = rnd(2, L>200?12:9); total*=n; items.push({op,n}); continue; }
    if(op==="-" && !c.neg){
      if(total < 2){ op="+"; } else { n = rnd(1, Math.min(c.max,total)); total-=n; items.push({op,n}); continue; }
    }
    n = rnd(c.min, c.max);
    total = op==="+" ? total+n : total-n;
    items.push({op,n});
  }
  return {items, answer: total, cfg:c};
}
function stageLabel(s){
  const L = s*20+1, c = cfg(L), c2 = cfg(L+19);
  const ops = c2.ops.join(" ");
  return `${c.count}–${c2.count} números · hasta ${c2.max} · ${ops}`;
}
const STAGE_NAMES = ["Primeros pasos","Calentando","Restas en juego","Ritmo","Doble dígito","Entra el ×","Cadena larga","Sin red","Todo vale","Cuatro operaciones","Centenas","Velocidad","Mente fría","Elite","Leyenda"];

/* ---------- utilidades ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
let actx=null;
function beep(f=660,d=.06){ try{ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; g.gain.value=.06; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
function fmt(n){ return n<0 ? "−"+Math.abs(n) : String(n); }

function topBar(back){
  const r = rankInfo();
  return `<div class="top">
    ${back?`<button class="back" data-go="${back}" aria-label="Volver">←</button>`:""}
    <div class="rank">
      <div class="rank-name">${esc(r.name)}<small>Rango ${r.n} · <span class="num">${S.xp}</span> XP</small></div>
      <div class="bar"><i style="width:${r.pct}%"></i></div>
    </div>
    <div class="coins"><span class="coin"></span><span class="num">${S.coins}</span></div>
  </div>`;
}

/* ---------- pantallas ---------- */
let timers = [];
function clearTimers(){ timers.forEach(t=>{clearTimeout(t);clearInterval(t)}); timers=[]; stopMic(); }

function home(){
  clearTimers();
  const h = highest();
  $app.innerHTML = `${topBar()}
  <div class="hello"><h1>¿Qué entrenamos hoy?</h1>
  <p>Cada juego suma experiencia a tu rango y te da monedas para pedir ayudas.</p></div>
  <div class="games">
    <button class="game live" data-go="levels">
      <div class="ic">5+6</div>
      <div><div class="tag">Cálculo mental</div><h3>Cadena</h3><p>Los números aparecen de a uno. Cuando termina, tenés ${ANSWER_TIME} segundos para el resultado.</p></div>
      <div class="prog"><span class="num">${h}</span>/${TOTAL_LEVELS}</div>
    </button>
    <button class="game" disabled><div class="ic">7?</div><div><div class="tag">Memoria</div><h3>Dígitos</h3><p>Recordá una serie de dígitos cada vez más larga.</p></div><div class="prog">Pronto</div></button>
    <button class="game" disabled><div class="ic">×</div><div><div class="tag">Velocidad</div><h3>Tablas relámpago</h3><p>Resolvé todas las multiplicaciones que puedas en 60 segundos.</p></div><div class="prog">Pronto</div></button>
    <button class="game" disabled><div class="ic">&lt;&gt;</div><div><div class="tag">Comparar</div><h3>Mayor o menor</h3><p>Elegí qué cuenta da más antes de que se acabe el tiempo.</p></div><div class="prog">Pronto</div></button>
  </div>
  <p class="note">Tu progreso se guarda en este dispositivo.</p>`;
}

function levels(){
  clearTimers();
  const h = highest(); const stages = TOTAL_LEVELS/20;
  let html = `${topBar("home")}<div class="hello"><h1>Cadena</h1><p>La cuenta se resuelve en orden, como en una calculadora: 5 + 6 × 2 = 22.</p></div><div class="levels">`;
  for(let s=0;s<stages;s++){
    if(s*20+1 > h+21 && s>0){ html += `<div class="stage"><div class="stage-head"><h2>Etapa ${s+1} a ${stages}</h2><span>Se desbloquean a medida que avanzás</span></div></div>`; break; }
    html += `<div class="stage"><div class="stage-head"><h2>Etapa ${s+1} · ${STAGE_NAMES[s]||"Etapa"}</h2><span>${stageLabel(s)}</span></div><div class="grid">`;
    for(let L=s*20+1; L<=s*20+20; L++){
      const st = cleared()[L];
      if(st) html += `<button class="lv" data-lv="${L}">${L}<span class="st">${"★".repeat(st)}</span></button>`;
      else if(L===h+1) html += `<button class="lv next" data-lv="${L}" aria-label="Nivel ${L}, siguiente">${L}<span class="st"></span></button>`;
      else html += `<button class="lv lock" disabled aria-label="Nivel ${L} bloqueado">${L}<span class="st"></span></button>`;
    }
    html += `</div></div>`;
  }
  $app.innerHTML = html + `</div>`;
  const nx = $app.querySelector(".lv.next"); if(nx) nx.scrollIntoView({block:"center"});
}

/* ---------- partida ---------- */
let G = null;
function play(L){
  clearTimers();
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  G = Object.assign(genLevel(L), {L, input:"", extra:0, used:{}, phase:"show"});
  $app.innerHTML = `${topBar("levels")}
  <div class="play">
    <div class="hud"><span>Nivel <b>${L}</b></span><span><b>${G.items.length}</b> números · ${(G.cfg.speed/1000).toFixed(1)} s cada uno</span></div>
    <div class="stagebox" id="box"></div>
    <div id="bottom"></div>
  </div>`;
  showSequence();
}
function showSequence(){
  G.phase="show";
  const box = document.getElementById("box");
  document.getElementById("bottom").innerHTML = `<p class="hint">Mirá y calculá en tu cabeza…</p>`;
  box.innerHTML = `<div class="big" id="big"><span class="num">¿Listo?</span></div><div class="dots">${G.items.map(()=>"<i></i>").join("")}</div>`;
  const big = document.getElementById("big"); big.style.fontSize="48px";
  let i = 0; const sp = G.cfg.speed;
  const step = () => {
    if(i >= G.items.length){ askAnswer(); return; }
    const it = G.items[i];
    big.style.fontSize="";
    big.innerHTML = (it.op?`<span class="op">${it.op}</span>`:"") + `<span class="num">${it.n}</span>`;
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    box.querySelectorAll(".dots i")[i].classList.add("on");
    beep(520 + i*25);
    i++;
    timers.push(setTimeout(()=>{ big.innerHTML="&nbsp;"; timers.push(setTimeout(step, 130)); }, sp-130));
  };
  timers.push(setTimeout(step, 900));
}
function askAnswer(){
  G.phase="answer"; G.input=""; G.t0=performance.now();
  const box = document.getElementById("box");
  box.innerHTML = `<p class="hint">¿Cuánto da?</p><div class="answer empty" id="ans">?</div>
    <div class="timer" id="timer" style="width:100%"><i id="tbar"></i></div>`;
  renderBottom();
  const tick = () => {
    const total = ANSWER_TIME + G.extra;
    const left = total - (performance.now()-G.t0)/1000;
    const tb = document.getElementById("tbar"); if(!tb) return;
    tb.style.width = Math.max(0,left/total*100)+"%";
    document.getElementById("timer").classList.toggle("warn", left<3);
    if(left<=0){ finish(null); }
  };
  timers.push(setInterval(tick, 50));
}
function renderBottom(){
  const b = document.getElementById("bottom");
  const helps = Object.entries(HELPS).map(([k,h])=>`<button class="help" data-help="${k}" ${G.used[k]||S.coins<h.cost?"disabled":""}>${h.name}<small><span class="coin"></span>${h.cost}</small></button>`).join("");
  let main;
  if(G.choices){
    main = `<div class="choices">${G.choices.map(c=>`<button data-pick="${c}" class="num">${fmt(c)}</button>`).join("")}</div>`;
  } else {
    const k = (v,l=v,cls="")=>`<button class="key ${cls}" data-key="${v}">${l}</button>`;
    main = `<div class="pad">
      ${k(1)}${k(2)}${k(3)}${k("del","⌫")}
      ${k(4)}${k(5)}${k(6)}${k("neg","±")}
      ${k(7)}${k(8)}${k(9)}${k("mic","Decir","mic")}
      ${k(0)}<button class="key ok" data-key="ok" style="grid-column:span 3">Listo</button>
    </div>`;
  }
  b.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px"><div class="helps">${helps}</div>${main}</div>`;
}
function setInput(v){
  G.input = v;
  const a = document.getElementById("ans");
  if(a){ a.textContent = v===""||v==="-" ? (v==="-"?"−":"?") : fmt(+v); a.classList.toggle("empty", v===""); }
}
function useHelp(k){
  const h = HELPS[k]; if(G.used[k] || S.coins < h.cost) return;
  S.coins -= h.cost; G.used[k]=true; save();
  document.querySelector(".coins .num").textContent = S.coins;
  if(k==="time"){ G.extra += 5; toast("Tenés 5 segundos más"); renderBottom(); }
  if(k==="choices"){
    const set = new Set([G.answer]);
    while(set.size<3){ const d = rnd(1, Math.max(3, Math.min(12, Math.ceil(Math.abs(G.answer)*.15)))); set.add(G.answer + (Math.random()<.5?-d:d)); }
    G.choices = [...set].sort(()=>Math.random()-.5); renderBottom();
  }
  if(k==="replay"){ clearTimers(); showSequence(); }
}
function finish(val){
  if(G.phase!=="answer") return;
  G.phase="done"; clearTimers();
  const ok = val!==null && val===G.answer;
  const used = (performance.now()-G.t0)/1000, total = ANSWER_TIME+G.extra;
  let stars=0, coins=0, xp=0;
  if(ok){
    stars = used <= total*.4 ? 3 : used <= total*.7 ? 2 : 1;
    if(Object.keys(G.used).length) stars = Math.min(stars, 2);
    const prev = cleared()[G.L]||0;
    coins = stars*3 + (prev?0:5) + Math.floor(G.L/10);
    xp = (8 + G.L) * stars + (prev?0:20);
    if(stars>prev) cleared()[G.L]=stars;
    S.coins += coins; S.xp += xp; save();
    beep(880,.12); setTimeout(()=>beep(1175,.15),130);
  } else beep(220,.25);
  const seq = G.items.map(it=>(it.op?it.op+" ":"")+it.n).join(" ") + " = " + fmt(G.answer);
  const r = rankInfo();
  $app.innerHTML = `${topBar("levels")}
  <div class="result">
    <h1>${ok?"¡Correcto!":(val===null?"Se acabó el tiempo":"Casi")}</h1>
    ${ok?`<div class="stars">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>`:
      val!==null?`<p class="hint">Pusiste <b class="num">${fmt(val)}</b></p>`:""}
    <div class="seq">${esc(seq)}</div>
    ${ok?`<div class="gains"><span><span class="coin"></span>+<span class="num">${coins}</span></span><span>+<span class="num">${xp}</span> XP</span></div>`:""}
    ${ok && G.used && Object.keys(G.used).length?`<p class="hint">Con ayudas, el máximo es 2 estrellas.</p>`:""}
    <div class="actions">
      ${ok && G.L<TOTAL_LEVELS?`<button class="btn primary" data-lv="${G.L+1}">Nivel ${G.L+1}</button>`:""}
      <button class="btn ${ok?"":"primary"}" data-lv="${G.L}">${ok?"Repetir nivel":"Intentar de nuevo"}</button>
      <button class="btn" data-go="levels">Ver niveles</button>
    </div>
  </div>`;
}

/* ---------- micrófono ---------- */
let rec=null;
const WORDS = {cero:0,uno:1,un:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50};
function parseSpoken(t){
  t = t.toLowerCase();
  const neg = /menos|negativo/.test(t);
  const m = t.replace(/\./g,"").match(/\d+/);
  let n = m ? +m[0] : null;
  if(n===null){ for(const w of t.split(/\s+/)) if(w in WORDS){ n = WORDS[w]; break; } }
  if(n===null) return null;
  return neg ? -n : n;
}
function startMic(btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Este navegador no permite dictar. Usá el teclado."); return; }
  try{
    rec = new SR(); rec.lang="es-AR"; rec.interimResults=false; rec.maxAlternatives=3;
    rec.onresult = e => {
      for(const alt of e.results[0]){ const n = parseSpoken(alt.transcript); if(n!==null){ setInput(String(n)); finish(n); return; } }
      toast("No entendí el número. Probá de nuevo.");
    };
    rec.onerror = () => toast("No se pudo usar el micrófono en esta vista. Usá el teclado.");
    rec.onend = () => { btn && btn.classList.remove("on"); rec=null; };
    rec.start(); btn.classList.add("on");
  }catch(e){ toast("No se pudo usar el micrófono en esta vista. Usá el teclado."); }
}
function stopMic(){ try{ rec && rec.abort(); }catch(e){} rec=null; }

/* ---------- eventos ---------- */
$app.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t || t.disabled) return;
  if(t.dataset.go){ t.dataset.go==="home"?home():levels(); return; }
  if(t.dataset.lv){ play(+t.dataset.lv); return; }
  if(!G || G.phase!=="answer") { if(t.dataset.help==="replay"){} return; }
  if(t.dataset.help){ useHelp(t.dataset.help); return; }
  if(t.dataset.pick!==undefined){ finish(+t.dataset.pick); return; }
  const k = t.dataset.key; if(k===undefined) return;
  if(k==="ok"){ if(G.input!==""&&G.input!=="-") finish(+G.input); return; }
  if(k==="del"){ setInput(G.input.slice(0,-1)); return; }
  if(k==="neg"){ setInput(G.input.startsWith("-")?G.input.slice(1):"-"+G.input); return; }
  if(k==="mic"){ rec?stopMic():startMic(t); return; }
  if(G.input.replace("-","").length<7) setInput(G.input+k);
});
document.addEventListener("keydown", e => {
  if(!G || G.phase!=="answer" || G.choices) return;
  if(/^\d$/.test(e.key)) setInput(G.input+e.key);
  else if(e.key==="Backspace") setInput(G.input.slice(0,-1));
  else if(e.key==="-") setInput(G.input.startsWith("-")?G.input.slice(1):"-"+G.input);
  else if(e.key==="Enter" && G.input!=="" && G.input!=="-") finish(+G.input);
});

home();
})();
</script>
