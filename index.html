<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2343D6">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>MenteCuenta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=Azeret+Mono:wght@500;700&display=swap">
<style>
/* Layout: una sola columna tipo app (máx 480px), pantallas que se reemplazan; el número en juego domina la pantalla. */
:root{
  --bg:#E9EDF5; --surface:#FFFFFF; --ink:#141A2B; --muted:#5B6479; --line:#D3D9E6;
  --accent:#2343D6; --accent-ink:#FFFFFF; --coin:#D99A0B; --good:#18A156; --bad:#E0352B; --warn:#F2B705; --on-warn:#2A1E00; --on-mood:#FFFFFF;
  --lock:#C7CEDC;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#161D33; --ink:#E8ECF7; --muted:#9AA4BE; --line:#28314C;
  --accent:#6A84FF; --accent-ink:#0D1222; --coin:#F2B531; --good:#2FD27A; --bad:#FF5A4E; --warn:#FFCB2E; --lock:#2C3552;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D33; --ink:#E8ECF7; --muted:#9AA4BE; --line:#28314C;
  --accent:#6A84FF; --accent-ink:#0D1222; --coin:#F2B531; --good:#2FD27A; --bad:#FF5A4E; --warn:#FFCB2E; --lock:#2C3552;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:480px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:18px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* barra superior */
.top{display:flex;align-items:center;gap:12px}
.top .back{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;flex:none}
.rank{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rank-name{font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-name small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
.coins{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:7px 12px 7px 8px;border-radius:999px;font-weight:700;flex:none}
.coin{width:18px;height:18px;border-radius:50%;background:var(--coin);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);display:inline-block}

/* inicio */
.hello h1{font-size:34px;font-weight:800;letter-spacing:-.01em}
.hello p{margin:6px 0 0;color:var(--muted);max-width:40ch}
.games{display:flex;flex-direction:column;gap:12px}
.game{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.game .ic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:20px;background:var(--bg)}
.game.live .ic{background:var(--accent);color:var(--accent-ink)}
.game h3{font-size:19px}
.game p{margin:2px 0 0;color:var(--muted);font-size:13px}
.game .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.game.live .tag{color:var(--accent)}
.game[disabled]{opacity:.62;cursor:default}
.game .prog{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* mapa de niveles */
.stage{display:flex;flex-direction:column;gap:10px}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage-head h2{font-size:20px}
.stage-head span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-num);font-weight:700;font-size:17px}
.lv .st{font-size:10px;letter-spacing:1px;color:var(--coin);height:12px}
.lv.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lv.lock{background:transparent;color:var(--lock);border-style:dashed;cursor:default}
.levels{display:flex;flex-direction:column;gap:26px}

/* juego */
.play{flex:1;display:flex;flex-direction:column;gap:16px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.hud b{color:var(--ink);font-family:var(--f-num)}
.stagebox{flex:1;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.big{font-family:var(--f-num);font-weight:700;font-size:clamp(72px,24vw,128px);line-height:1;letter-spacing:-.04em;display:flex;align-items:baseline;gap:.12em}
.big .op{color:var(--accent);font-size:.6em}
.big.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.82);opacity:.2}to{transform:none;opacity:1}}
.disc{width:clamp(150px,52vw,208px);height:clamp(150px,52vw,208px);border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:7px solid var(--accent);color:var(--ink);font-size:clamp(64px,22vw,96px);letter-spacing:-.04em;
  box-shadow:0 0 0 10px color-mix(in srgb, var(--accent) 14%, transparent), 0 14px 34px color-mix(in srgb, var(--accent) 30%, transparent)}
.disc.len3{font-size:clamp(48px,16vw,72px)}
.disc.len4{font-size:clamp(38px,13vw,56px)}
.micbtn{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent), 0 8px 20px color-mix(in srgb, var(--accent) 35%, transparent)}
.micbtn:active{transform:scale(.95)}
.micbtn.on{background:var(--bad);color:var(--on-mood);animation:listen 1.1s ease-in-out infinite}
@keyframes listen{50%{box-shadow:0 0 0 16px color-mix(in srgb, var(--bad) 22%, transparent), 0 8px 24px color-mix(in srgb, var(--bad) 40%, transparent)}}
.cue{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,12vw,52px);letter-spacing:-.01em;color:var(--muted)}
.cue.go{color:var(--accent);font-size:clamp(48px,15vw,64px)}
.opsign{font-family:var(--f-num);font-weight:700;font-size:clamp(90px,30vw,140px);line-height:1;color:var(--accent)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.hint{color:var(--muted);font-size:13px;text-align:center}
.timer{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--good);width:100%}
.timer.warn i{background:var(--bad)}
.answer{font-family:var(--f-num);font-weight:700;font-size:56px;min-height:64px;text-align:center;letter-spacing:-.02em}
.answer.empty{color:var(--line)}
.helps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.help{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:600}
.help small{display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.help small .coin{width:12px;height:12px}
.help:disabled{opacity:.4;cursor:default}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-num);font-size:22px;font-weight:700}
.key:active{transform:translateY(1px)}
.key.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--f-body);font-size:17px}
.key.mic{display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.key.mic.on{background:var(--bad);color:var(--on-mood);border-color:var(--bad);animation:listen 1.1s ease-in-out infinite}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choices button{height:64px;border-radius:14px;background:var(--surface);border:2px solid var(--accent);font-family:var(--f-num);font-size:24px;font-weight:700}

/* resultado */
.result{flex:1;display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center;--m:var(--good);--on-m:var(--on-mood)}
.result.mood-warn{--m:var(--warn);--on-m:var(--on-warn)}
.result.mood-bad{--m:var(--bad)}
.verdict{width:100%;border-radius:28px;padding:22px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--m) 38%, transparent), color-mix(in srgb, var(--m) 8%, var(--surface)) 70%);
  border:2px solid color-mix(in srgb, var(--m) 55%, transparent)}
.verdict h1{font-size:38px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.verdict p{margin:0;color:var(--muted);font-weight:500}
.verdict p b{color:var(--ink)}
.duel{display:flex;gap:22px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.who{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ball{border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.ball.hero{width:118px;height:118px;font-size:clamp(26px,9vw,36px);background:var(--m);color:var(--on-m);
  box-shadow:0 0 0 7px color-mix(in srgb, var(--m) 28%, transparent), 0 12px 30px color-mix(in srgb, var(--m) 45%, transparent);
  animation:land .55s cubic-bezier(.2,1.6,.4,1) both}
.ball.hero.truth{background:var(--good);color:var(--on-mood);box-shadow:0 0 0 7px color-mix(in srgb, var(--good) 28%, transparent);animation-delay:.12s}
.ball.hero.empty{background:var(--surface);color:var(--muted);border:3px dashed var(--m);box-shadow:none}
.mood-bad .ball.hero:not(.truth){animation:land .55s cubic-bezier(.2,1.6,.4,1) both, shake .45s .5s}
.mood-good .ball.hero{animation:land .55s cubic-bezier(.2,1.6,.4,1) both, glow 1.8s .6s ease-in-out infinite}
@keyframes land{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes glow{50%{box-shadow:0 0 0 14px color-mix(in srgb, var(--m) 12%, transparent), 0 12px 34px color-mix(in srgb, var(--m) 55%, transparent)}}
.result .stars{font-size:40px;letter-spacing:6px;color:var(--coin);line-height:1}
.result .stars .off{color:var(--line)}
.chainbox{width:100%;display:flex;flex-direction:column;gap:10px}
.chainbox h2{font-size:14px;font-family:var(--f-body);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 4px}
.chain .ball{min-width:46px;height:46px;padding:0 6px;font-size:16px;background:var(--surface);border:2px solid var(--accent);color:var(--ink);border-radius:999px;
  animation:land .4s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i) * 45ms)}
.chain .ball.final{background:var(--good);border-color:var(--good);color:var(--on-mood);min-width:56px;height:56px;font-size:19px}
.chain .sign{font-family:var(--f-num);font-weight:700;font-size:20px;color:var(--accent);width:22px;text-align:center;
  animation:land .4s both;animation-delay:calc(var(--i) * 45ms)}
.chain .sign.eq{color:var(--good)}
.gains{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gains span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;display:flex;align-items:center;gap:6px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
.actions{display:flex;flex-direction:column;gap:10px;width:100%}
.btn{height:54px;border-radius:16px;font-weight:700;font-size:16px;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
/* palabra escondida */
.wplay{display:flex;flex-direction:column;gap:12px}
.wform{display:flex;gap:8px}
.wform input{flex:1;min-width:0;height:54px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 18px var(--f-body);padding:0 16px}
.wform input:focus{outline:none;border-color:var(--accent)}
.wmic{width:54px;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.wmic.on{background:var(--bad);color:var(--on-mood);animation:listen 1.1s ease-in-out infinite}
.wsend{height:54px;padding:0 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;flex:none}
.whelps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wsec{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wrow{position:relative;display:flex;align-items:center;gap:10px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:0 6px 0 14px;overflow:hidden}
.wrow.last{border:2px solid var(--tc);animation:land .35s cubic-bezier(.2,1.5,.4,1) both}
.wbar{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb, var(--tc) 24%, transparent)}
.wword{position:relative;flex:1;min-width:0;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtag{position:relative;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:var(--surface)}
.wrank{position:relative;min-width:42px;height:36px;padding:0 9px;border-radius:999px;display:grid;place-items:center;background:var(--tc);color:var(--on-tc);font-weight:700;font-size:14px}
.t-good{--tc:var(--good);--on-tc:var(--on-mood)}
.t-warn{--tc:var(--warn);--on-tc:var(--on-warn)}
.t-bad{--tc:var(--bad);--on-tc:var(--on-mood)}
.wempty{text-align:center;color:var(--muted);font-size:14px;padding:18px 8px;border:1px dashed var(--line);border-radius:14px}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.wordball{padding:16px 30px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,10vw,44px);line-height:1.1;background:var(--good);color:var(--on-mood);max-width:100%;overflow-wrap:anywhere;
  box-shadow:0 0 0 7px color-mix(in srgb, var(--good) 26%, transparent), 0 12px 30px color-mix(in srgb, var(--good) 40%, transparent);animation:land .55s cubic-bezier(.2,1.6,.4,1) both}
.wchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wchip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;
  animation:land .4s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i) * 50ms)}
.wchip b{min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:var(--good);color:var(--on-mood);display:grid;place-items:center;font-size:12px;font-family:var(--f-num)}
@media (prefers-reduced-motion: reduce){.big.pop,.ball,.chain .sign,.wrow,.wordball,.wchip{animation:none!important}.bar i{transition:none}}
</style>

<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const TOTAL_LEVELS = 300;
const ANSWER_TIME = 10;
const RANKS = [
  ["Novato",0],["Aprendiz",400],["Contador",1200],["Calculista",3000],["Veloz",6500],
  ["Experto",12000],["Maestro",22000],["Gran Maestro",40000],["Leyenda",75000],["Mente Infinita",130000]
];
const HELPS = {
  replay:{name:"Repetir", cost:30},
  time:{name:"+5 seg", cost:20},
  choices:{name:"3 opciones", cost:40}
};

/* ---------- guardado ---------- */
let S = {coins:100, xp:0, games:{cadena:{}}};
try{ const raw = localStorage.getItem("mentecuenta"); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
S.games = Object.assign({cadena:{}, escondida:{}}, S.games);
function save(){ try{ localStorage.setItem("mentecuenta", JSON.stringify(S)); }catch(e){} }

function rankInfo(){
  let i = 0; while(i < RANKS.length-1 && S.xp >= RANKS[i+1][1]) i++;
  const cur = RANKS[i], nxt = RANKS[i+1];
  const pct = nxt ? (S.xp-cur[1])/(nxt[1]-cur[1])*100 : 100;
  return {name:cur[0], n:i+1, pct, next:nxt};
}
const cleared = () => S.games.cadena;
function highest(store){ store = store || cleared(); let h=0; for(const k in store) h=Math.max(h,+k); return h; }

/* ---------- generador de niveles ---------- */
function cfg(L){
  return {
    count: Math.min(3 + Math.floor((L-1)/7), 20),
    max: L<=10?9 : L<=30?15 : L<=60?25 : L<=110?50 : L<=180?99 : L<=240?250 : 999,
    min: L>110?10 : 1,
    ops: L<=5?["+"] : L<=40?["+","-"] : L<=90?["+","-","×"] : ["+","-","×","÷"],
    speed: Math.max(520, 1650 - L*6),
    neg: L>70
  };
}
const rnd = (a,b)=> a + Math.floor(Math.random()*(b-a+1));
function genLevel(L){
  const c = cfg(L);
  let total = rnd(Math.max(c.min,2), c.max);
  const items = [{op:"", n:total}];
  for(let i=1;i<c.count;i++){
    let op = c.ops[rnd(0,c.ops.length-1)], n;
    if(op==="×" && (Math.abs(total)>150 || total===0)) op="+";
    if(op==="÷"){
      const ds=[]; for(let d=2; d<=12; d++) if(total!==0 && total%d===0 && Math.abs(total)/d>=2) ds.push(d);
      if(ds.length){ n = ds[rnd(0,ds.length-1)]; total/=n; items.push({op,n}); continue; }
      op="-";
    }
    if(op==="×"){ n = rnd(2, L>200?12:9); total*=n; items.push({op,n}); continue; }
    if(op==="-" && !c.neg){
      if(total < 2){ op="+"; } else { n = rnd(1, Math.min(c.max,total)); total-=n; items.push({op,n}); continue; }
    }
    n = rnd(c.min, c.max);
    total = op==="+" ? total+n : total-n;
    items.push({op,n});
  }
  return {items, answer: total, cfg:c};
}
function stageLabel(s){
  const L = s*20+1, c = cfg(L), c2 = cfg(L+19);
  const ops = c2.ops.join(" ");
  return `${c.count}–${c2.count} números · hasta ${c2.max} · ${ops}`;
}
const STAGE_NAMES = ["Primeros pasos","Calentando","Restas en juego","Ritmo","Doble dígito","Entra el ×","Cadena larga","Sin red","Todo vale","Cuatro operaciones","Centenas","Velocidad","Mente fría","Elite","Leyenda"];

/* ---------- utilidades ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
let actx=null;
function beep(f=660,d=.06){ try{ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; g.gain.value=.06; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
function fmt(n){ return n<0 ? "−"+Math.abs(n) : String(n); }

function topBar(back){
  const r = rankInfo();
  return `<div class="top">
    ${back?`<button class="back" data-go="${back}" aria-label="Volver">←</button>`:""}
    <div class="rank">
      <div class="rank-name">${esc(r.name)}<small>Rango ${r.n} · <span class="num">${S.xp}</span> XP</small></div>
      <div class="bar"><i style="width:${r.pct}%"></i></div>
    </div>
    <div class="coins"><span class="coin"></span><span class="num">${S.coins}</span></div>
  </div>`;
}

/* ---------- pantallas ---------- */
let timers = [];
function clearTimers(){ const cf=document.getElementById("confetti"); if(cf) cf.remove(); timers.forEach(t=>{clearTimeout(t);clearInterval(t)}); timers=[]; stopMic(); }

function home(){
  clearTimers();
  const h = highest();
  $app.innerHTML = `${topBar()}
  <div class="hello"><h1>¿Qué entrenamos hoy?</h1>
  <p>Cada juego suma experiencia a tu rango y te da monedas para pedir ayudas.</p></div>
  <div class="games">
    <button class="game live" data-go="levels">
      <div class="ic">5+6</div>
      <div><div class="tag">Cálculo mental</div><h3>Cadena</h3><p>Los números aparecen de a uno. Cuando termina, tenés ${ANSWER_TIME} segundos para el resultado.</p></div>
      <div class="prog"><span class="num">${h}</span>/${TOTAL_LEVELS}</div>
    </button>
    <button class="game live" data-go="wlevels">
      <div class="ic">?</div>
      <div><div class="tag">Palabras</div><h3>Palabra escondida</h3><p>Probá palabras: cada una recibe un número según qué tan cerca está de la escondida.</p></div>
      <div class="prog"><span class="num">${highest(S.games.escondida)}</span>/${WDATA.length}</div>
    </button>
    <button class="game" disabled><div class="ic">×</div><div><div class="tag">Velocidad</div><h3>Tablas relámpago</h3><p>Resolvé todas las multiplicaciones que puedas en 60 segundos.</p></div><div class="prog">Pronto</div></button>
    <button class="game" disabled><div class="ic">&lt;&gt;</div><div><div class="tag">Comparar</div><h3>Mayor o menor</h3><p>Elegí qué cuenta da más antes de que se acabe el tiempo.</p></div><div class="prog">Pronto</div></button>
  </div>
  <p class="note">Tu progreso se guarda en este dispositivo.</p>`;
}

function levelMap(o){
  clearTimers();
  const h = highest(o.store); const stages = Math.ceil(o.total/20);
  let html = `${topBar("home")}<div class="hello"><h1>${o.title}</h1><p>${o.desc}</p></div><div class="levels">`;
  for(let s=0;s<stages;s++){
    if(s*20+1 > h+21 && s>0){ html += `<div class="stage"><div class="stage-head"><h2>Etapa ${s+1} a ${stages}</h2><span>Se desbloquean a medida que avanzás</span></div></div>`; break; }
    html += `<div class="stage"><div class="stage-head"><h2>Etapa ${s+1} · ${o.names[s]||"Etapa"}</h2><span>${o.label(s)}</span></div><div class="grid">`;
    for(let L=s*20+1; L<=Math.min(o.total, s*20+20); L++){
      const st = o.store[L];
      if(st) html += `<button class="lv" data-${o.attr}="${L}">${L}<span class="st">${"★".repeat(st)}</span></button>`;
      else if(L===h+1) html += `<button class="lv next" data-${o.attr}="${L}" aria-label="Nivel ${L}, siguiente">${L}<span class="st"></span></button>`;
      else html += `<button class="lv lock" disabled aria-label="Nivel ${L} bloqueado">${L}<span class="st"></span></button>`;
    }
    html += `</div></div>`;
  }
  $app.innerHTML = html + `</div>`;
  const nx = $app.querySelector(".lv.next"); if(nx) nx.scrollIntoView({block:"center"});
}
function levels(){
  levelMap({title:"Cadena", desc:"La cuenta se resuelve en orden, como en una calculadora: 5 + 6 × 2 = 22.",
    store:S.games.cadena, total:TOTAL_LEVELS, names:STAGE_NAMES, label:stageLabel, attr:"lv"});
}

/* ---------- partida ---------- */
let G = null;
function play(L){
  clearTimers();
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  G = Object.assign(genLevel(L), {L, input:"", extra:0, used:{}, phase:"show"});
  $app.innerHTML = `${topBar("levels")}
  <div class="play">
    <div class="hud"><span>Nivel <b>${L}</b></span><span><b>${G.items.length}</b> números · ${(G.cfg.speed/1000).toFixed(1)} s cada uno</span></div>
    <div class="stagebox" id="box"></div>
    <div id="bottom"></div>
  </div>`;
  showSequence();
}
function showSequence(){
  G.phase="show";
  const box = document.getElementById("box");
  document.getElementById("bottom").innerHTML = `<p class="hint">Mirá y calculá en tu cabeza…</p>`;
  box.innerHTML = `<div class="big" id="big"><span class="cue">Preparado…</span></div><div class="dots">${G.items.map(()=>"<i></i>").join("")}</div>`;
  const big = document.getElementById("big"); big.style.fontSize="48px";
  let i = 0; const sp = G.cfg.speed;
  const opT = Math.round(sp*0.38);
  const showNum = (it, idx) => {
    const len = String(it.n).length;
    big.style.fontSize="";
    big.innerHTML = `<span class="disc num len${Math.min(len,4)}">${it.n}</span>`;
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    box.querySelectorAll(".dots i")[idx].classList.add("on");
    beep(520 + idx*25);
    const t = idx===0 ? sp : sp-opT;
    timers.push(setTimeout(()=>{ big.innerHTML="&nbsp;"; timers.push(setTimeout(step, 110)); }, t-110));
  };
  const step = () => {
    if(i >= G.items.length){ askAnswer(); return; }
    const it = G.items[i], idx = i; i++;
    if(!it.op){ showNum(it, idx); return; }
    big.style.fontSize="";
    big.innerHTML = `<span class="opsign">${it.op==="-"?"−":it.op}</span>`;
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    beep(330,.04);

  for(const k of plurals(n)) if(VIDX.has(k)) return VIDX.get(k);

function vAdd(w, mem, tags){

  if(tags) tags.forEach(t=>e.tags.add(t));

}

    const sKey = path.join("/"), cKey = path.slice(0,2).join("/"), dKey = path[0];
    m[3].trim().split(/\s+/).forEach((w,pos)=>vAdd(w, {d:dKey, c:cKey, s:sKey, pos}, tags));

function listIdx(text){ const out=[]; const seen=new Set();

const AFIN = {animales:"plantas naturaleza lugares comida", plantas:"animales naturaleza comida", comida:"plantas hogar cuerpo salud",
  cuerpo:"salud acciones ropa deporte", salud:"cuerpo personas", personas:"sociedad mente hogar", hogar:"construcción comida ropa personas",
  construcción:"hogar lugares", ropa:"cuerpo hogar", lugares:"naturaleza transporte sociedad", transporte:"lugares tecnología",
  naturaleza:"lugares animales plantas tiempo colores", tiempo:"naturaleza mente", tecnología:"comunicación ciencia transporte",
  cultura:"deporte mente educación sociedad", deporte:"cultura cuerpo", educación:"ciencia cultura comunicación", ciencia:"educación matemática tecnología naturaleza",
  matemática:"ciencia educación medidas", colores:"cultura naturaleza", medidas:"matemática ciencia", sociedad:"personas mente cultura",
  mente:"sociedad comunicación personas", comunicación:"mente tecnología sociedad", acciones:"cuerpo personas"};

function namesOf(sec){ const set = new Map();
  const add = (w, v) => { const i = vFind(norm(w)); if(i>=0 && (set.get(i)||0) < v) set.set(i, v); };

function wRanking(lv){

  const via = new Map();
  for(const [ti, T] of CURATED){
    const rt = posA.has(ti) ? posA.get(ti) : posB.has(ti) ? 60 + posB.get(ti) : null;
    if(rt===null) continue;

    keyed.push([k, i]);

  keyed.forEach(([,i],j)=>{ rank.set(i, j+2); order.push(i); });

  document.querySelector(".coins .num").textContent = S.coins;
  const hc = document.getElementById("whcost"); if(hc) hc.textContent = HINT_COST[Math.min(W.hints, HINT_COST.length-1)];
  wAdd({word:VOCAB[pick].w, r:W.rank.get(pick), i:pick, hint:true});
}
function wGiveUp(btn){
  if(!W || W.done) return;
  if(!btn.dataset.sure){ btn.dataset.sure="1"; btn.innerHTML = `¿Seguro?<small>tocá de nuevo</small>`;
    timers.push(setTimeout(()=>{ if(document.body.contains(btn)){ delete btn.dataset.sure; btn.innerHTML=`Rendirse<small>ver la palabra</small>`; } }, 3000)); return; }
  wEnd(false);
}
function wEnd(ok){
  W.done = true; clearTimers();
  const n = W.guesses.length;
  let stars=0, coins=0, xp=0;
  if(ok){
    const d = wDiff(W.L); stars = n<=d.s3 ? 3 : n<=d.s2 ? 2 : 1;
    if(W.hints) stars = Math.min(stars, 2);
    const prev = S.games.escondida[W.L]||0;
    coins = stars*4 + (prev?0:6) + Math.floor(W.L/10);
    xp = (15 + W.L*2) * stars + (prev?0:20);
    if(stars>prev) S.games.escondida[W.L] = stars;
    S.coins += coins; S.xp += xp; save();
    beep(880,.12); setTimeout(()=>beep(1175,.15),130);
  } else beep(220,.25);
  const chips = W.order.slice(1,11).map((vi,i)=>`<span class="wchip" style="--i:${i}"><b>${i+2}</b>${esc(VOCAB[vi].w)}</span>`).join("");
  $app.innerHTML = `${topBar("wlevels")}
  <div class="result mood-${ok?"good":"bad"}">
    <div class="verdict">
      <h1>${ok?"¡La encontraste!":"Te rendiste"}</h1>
      <p>${ok?`En <b class="num">${n}</b> ${n===1?"intento":"intentos"}${W.hints?` y ${W.hints} ${W.hints===1?"pista":"pistas"}`:""}`:"La palabra escondida era"}</p>
      <div class="wordball">${esc(W.lv.w)}</div>
      ${ok?`<div class="stars" aria-label="${stars} de 3 estrellas">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>`:""}
    </div>
    ${ok?`<div class="gains"><span><span class="coin"></span>+<span class="num">${coins}</span></span><span>+<span class="num">${xp}</span> XP</span></div>`:""}
    ${ok?`<p class="hint">Nivel ${wDiff(W.L).name}: 3 estrellas con hasta ${wDiff(W.L).s3} intentos, 2 con hasta ${wDiff(W.L).s2}. Con pistas, máximo 2.</p>`:""}
    <div class="chainbox"><h2>Las más cercanas</h2><div class="wchips">${chips}</div></div>
    <div class="actions">
      ${ok && W.L<WDATA.length?`<button class="btn primary" data-wlv="${W.L+1}">Nivel ${W.L+1}</button>`:""}
      ${!ok && W.L<WDATA.length && S.games.escondida[W.L]?`<button class="btn primary" data-wlv="${W.L+1}">Nivel ${W.L+1}</button>`:""}
      <button class="btn ${ok?"":"primary"}" data-wlv="${W.L}">${ok?"Jugar de nuevo":"Volver a intentar"}</button>
      <button class="btn" data-go="wlevels">Ver niveles</button>
    </div>
  </div>`;
  if(ok) confetti();
}


/* ---------- micrófono ---------- */
let rec=null;
const WORDS = {cero:0,uno:1,un:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50};
function parseSpoken(t){
  t = t.toLowerCase();
  const neg = /menos|negativo/.test(t);
  const m = t.replace(/\./g,"").match(/\d+/);
  let n = m ? +m[0] : null;
  if(n===null){ for(const w of t.split(/\s+/)) if(w in WORDS){ n = WORDS[w]; break; } }
  if(n===null) return null;
  return neg ? -n : n;
}
function startMic(btn, onAlts, idle, listening){
  idle = idle || "Escribí el resultado o tocá el micrófono"; listening = listening || "Escuchando… decí el número";
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Este navegador no permite dictar. Usá el teclado."); return; }
  try{
    rec = new SR(); rec.lang="es-AR"; rec.interimResults=false; rec.maxAlternatives=3;
    rec.onresult = e => {
      if(onAlts){ onAlts([...e.results[0]].map(a=>a.transcript)); return; }
      for(const alt of e.results[0]){ const n = parseSpoken(alt.transcript); if(n!==null){ setInput(String(n)); finish(n); return; } }
      toast("No entendí el número. Probá de nuevo.");
    };
    rec.onerror = () => toast("No se pudo usar el micrófono en esta vista. Usá el teclado.");
    rec.onend = () => { btn && btn.classList.remove("on"); rec=null; micStatus(idle); };
    rec.start(); btn.classList.add("on"); micStatus(listening);
  }catch(e){ toast("No se pudo usar el micrófono en esta vista. Usá el teclado."); }
}
function micStatus(t){ const m=document.getElementById("micst"); if(m) m.textContent=t; }
function stopMic(){ try{ rec && rec.abort(); }catch(e){} rec=null; }

/* ---------- eventos ---------- */
$app.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t || t.disabled) return;
  if(t.dataset.go){ const g=t.dataset.go; g==="home"?home(): g==="wlevels"?wlevels():levels(); return; }
  if(t.dataset.wlv){ wplay(+t.dataset.wlv); return; }
  if(t.dataset.whelp!==undefined){ wHint(); return; }
  if(t.dataset.wgive!==undefined){ wGiveUp(t); return; }
  if(t.dataset.wmic!==undefined){ rec?stopMic():startMic(t, alts=>{ const w=(alts[0]||"").trim().split(/\s+/).pop()||""; const inp=document.getElementById("wguess"); if(inp) inp.value=w; wGuess(w); }, "Escribí una palabra o tocá el micrófono", "Escuchando… decí una palabra"); return; }
  if(t.dataset.lv){ play(+t.dataset.lv); return; }
  if(!G || G.phase!=="answer") { if(t.dataset.help==="replay"){} return; }
  if(t.dataset.help){ useHelp(t.dataset.help); return; }
  if(t.dataset.pick!==undefined){ finish(+t.dataset.pick); return; }
  const k = t.dataset.key; if(k===undefined) return;
  if(k==="ok"){ if(G.input!==""&&G.input!=="-") finish(+G.input); return; }
  if(k==="del"){ setInput(G.input.slice(0,-1)); return; }
  if(k==="clr"){ setInput(""); return; }
  if(k==="neg"){ setInput(G.input.startsWith("-")?G.input.slice(1):"-"+G.input); return; }
  if(k==="mic"){ rec?stopMic():startMic(t); return; }
  if(G.input.replace("-","").length<7) setInput(G.input+k);
});
document.addEventListener("keydown", e => {
  if(!G || G.phase!=="answer" || G.choices) return;
  if(/^\d$/.test(e.key)) setInput(G.input+e.key);
  else if(e.key==="Backspace") setInput(G.input.slice(0,-1));
  else if(e.key==="-") setInput(G.input.startsWith("-")?G.input.slice(1):"-"+G.input);
  else if(e.key==="Enter" && G.input!=="" && G.input!=="-") finish(+G.input);
});

home();
})();
</script>
