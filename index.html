<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7B3FF2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mente Despierta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&family=Azeret+Mono:wght@500;700&display=swap">
<style>
/* Layout: una sola columna tipo app (máx 480px), pantallas que se reemplazan; el número en juego domina la pantalla. */
:root{
  --bg:#E9EDF5; --surface:#FFFFFF; --ink:#141A2B; --muted:#5B6479; --line:#D3D9E6;
  --accent:#2343D6; --accent-ink:#FFFFFF; --coin:#D99A0B; --good:#18A156; --bad:#E0352B; --warn:#F2B705; --on-warn:#2A1E00; --on-mood:#FFFFFF;
  --lock:#C7CEDC;
  --c1:#FF6A3D; --c1b:#FF9F1C; --c2:#7B3FF2; --c2b:#E04BC9; --c3:#00A88F; --c3b:#3DCCF2; --c4:#FF4F8B; --c5:#FFC233; --c6:#2F6BFF; --c7:#E5383B; --ink-on:#FFFFFF;
  --f-display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1222; --surface:#161D33; --ink:#E8ECF7; --muted:#9AA4BE; --line:#28314C;
  --accent:#6A84FF; --accent-ink:#0D1222; --coin:#F2B531; --good:#2FD27A; --bad:#FF5A4E; --warn:#FFCB2E; --lock:#2C3552;
  --c1:#FF7A4D; --c1b:#FFB02E; --c2:#8F5CFF; --c2b:#F05BD6; --c3:#17C2A6; --c3b:#4FD5FF; --c4:#FF6B9E; --c5:#FFCF4D; --c6:#5B8CFF; --c7:#FF5A5F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#161D33; --ink:#E8ECF7; --muted:#9AA4BE; --line:#28314C;
  --accent:#6A84FF; --accent-ink:#0D1222; --coin:#F2B531; --good:#2FD27A; --bad:#FF5A4E; --warn:#FFCB2E; --lock:#2C3552;
  --c1:#FF7A4D; --c1b:#FFB02E; --c2:#8F5CFF; --c2b:#F05BD6; --c3:#17C2A6; --c3b:#4FD5FF; --c4:#FF6B9E; --c5:#FFCF4D; --c6:#5B8CFF; --c7:#FF5A5F;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:480px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:18px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* barra superior */
.top{display:flex;align-items:center;gap:12px}
.top .back{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;flex:none}
.rank{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rank-name{font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-name small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
.coins{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:7px 12px 7px 8px;border-radius:999px;font-weight:700;flex:none}
.coin{width:18px;height:18px;border-radius:50%;background:var(--coin);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);display:inline-block}

/* inicio */
.hello h1{font-size:34px;font-weight:800;letter-spacing:-.01em}
.hello p{margin:6px 0 0;color:var(--muted);max-width:40ch}
/* portada */
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:4px}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,12vw,58px);line-height:1;letter-spacing:-.01em;display:flex;flex-wrap:wrap;justify-content:center;column-gap:.28em}
.logo .lw{display:inline-flex}
.logo .lw > span{display:inline-block;animation:bob 3s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-3px) rotate(-2deg)}}
.brand p{margin:0;color:var(--muted);font-size:16px;font-weight:500;max-width:32ch;text-wrap:balance}
.daycard{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:var(--ink-on);text-align:left;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(135deg, var(--c3), var(--c3b));box-shadow:0 14px 30px color-mix(in srgb, var(--c3) 35%, transparent)}
.daycard::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16)}
.daycard .kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.daycard h2{font-size:30px;font-weight:700;position:relative}
.daycard p{margin:0;opacity:.95;position:relative}
.daycard .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative}
.daycard .go{background:var(--ink-on);color:var(--c3);font-weight:700;border-radius:14px;padding:12px 18px;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:22px;margin:6px 0 -6px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{position:relative;overflow:hidden;border-radius:24px;padding:16px;min-height:178px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;color:var(--ink-on);
  background:linear-gradient(150deg, var(--g1), var(--g2));box-shadow:0 10px 24px color-mix(in srgb, var(--g1) 32%, transparent);transition:transform .15s}
.game:active{transform:scale(.97)}
.game.g-cadena{--g1:var(--c1);--g2:var(--c1b)}
.game.g-palabra{--g1:var(--c2);--g2:var(--c2b)}
.game .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;background:rgba(255,255,255,.95);color:var(--g1);transform:rotate(-6deg);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.game h3{font-size:22px;font-weight:700}
.game p{margin:2px 0 0;font-size:13px;opacity:.95;line-height:1.35}
.game .prog{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.game .prog .pbar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden}
.game .prog .pbar i{display:block;height:100%;background:var(--ink-on);border-radius:6px}
.game .bubble{position:absolute;right:-26px;bottom:-26px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.game.g-mayor{--g1:var(--c4);--g2:var(--c5)}
.game.g-secuencia{--g1:var(--c6);--g2:var(--c3b)}
.game.g-bloques{--g1:var(--c7);--g2:var(--c1b)}
.game .ic.bkic{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;padding:10px;box-sizing:border-box;place-items:stretch}
.bkic i{border-radius:4px;display:block}
.bkic .a{grid-area:2 / 1 / 3 / 3;background:#E5383B}
.bkic .b{grid-area:1 / 3 / 3 / 4;background:#3B82F6}
.bkic .c{grid-area:3 / 2 / 4 / 4;background:#FACC15}
.bkplay{display:flex;flex-direction:column;gap:12px}
.bkframe{position:relative;width:min(100%,360px);margin:6px auto 0;padding:8px;border-radius:20px;box-sizing:border-box;
  background:color-mix(in srgb, var(--ink) 82%, var(--c2));box-shadow:0 10px 26px rgba(0,0,0,.18)}
.bkboard{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;touch-action:none;
  background-color:color-mix(in srgb, var(--surface) 92%, var(--c2));
  background-image:linear-gradient(color-mix(in srgb, var(--line) 80%, transparent) 1px, transparent 1px),linear-gradient(90deg, color-mix(in srgb, var(--line) 80%, transparent) 1px, transparent 1px);
  background-size:calc(100% / 6) calc(100% / 6)}
.bkexit{position:absolute;right:-6px;width:14px;top:calc(8px + (100% - 16px) * 2 / 6 + 4px);height:calc((100% - 16px) / 6 - 8px);border-radius:0 8px 8px 0;background:var(--c7)}
.bkexit::after{content:"›";position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-on);font-weight:800;font-size:16px;line-height:1}
.bkblk{position:absolute;padding:4px;box-sizing:border-box;border:0;background:none;cursor:grab;touch-action:none;transition:transform .14s ease-out;z-index:1}
.bkblk::before{content:"";position:absolute;inset:4px;border-radius:10px;background:var(--bc);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.35), 0 3px 6px rgba(0,0,0,.18)}
.bkblk.red{--bc:var(--c7)}
.bkblk span{position:relative;display:grid;place-items:center;height:100%;color:#fff;font-size:22px;font-weight:700;pointer-events:none}
.bkblk.drag{transition:none;z-index:3;cursor:grabbing}
.bkblk.drag::before{filter:brightness(1.08)}
.bkblk:focus-visible{outline:none}
.bkblk:focus-visible::before{outline:3px solid var(--ink);outline-offset:1px}
.bkblk.hint::before{animation:bkpulse 1s ease-in-out infinite}
@keyframes bkpulse{50%{box-shadow:0 0 0 5px var(--c5), inset 0 -5px 0 rgba(0,0,0,.18)}}
.bkblk.out{transition:transform .5s cubic-bezier(.5,0,.8,.4)}
.bkghost{position:absolute;box-sizing:border-box;border:3px dashed var(--c5);border-radius:12px;pointer-events:none}
.bkwall{position:absolute;width:calc(100% / 6);height:calc(100% / 6);padding:4px;box-sizing:border-box}
.bkwall::before{content:"";position:absolute;inset:4px;border-radius:8px;background:repeating-linear-gradient(45deg, color-mix(in srgb, var(--ink) 70%, transparent) 0 6px, color-mix(in srgb, var(--ink) 50%, transparent) 6px 12px)}
.bkctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (prefers-reduced-motion: reduce){.bkblk,.bkblk.out{transition:none}.bkblk.hint::before{animation:none}}
.game .ic.sqic{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px;box-sizing:border-box}
.sqic i{border-radius:50%;display:block;width:15px;height:15px}
.sqboard{position:relative;width:min(100%,340px);aspect-ratio:1;max-width:100%;margin:0 auto}
.sqboard svg{width:100%;height:100%;display:block;touch-action:manipulation;overflow:visible}
.sqpad{fill:var(--pc);opacity:.4;stroke:var(--bg);stroke-width:5;stroke-linejoin:round;cursor:pointer;transition:opacity .07s, filter .07s;outline:none}
.sqpad:focus-visible{stroke:var(--ink)}
.sqpad.on{opacity:1;filter:brightness(1.18) drop-shadow(0 0 12px var(--pc))}
.sqboard.wait .sqpad{cursor:default}
.sqboard.idle{cursor:pointer}
.sqboard.idle .sqpad{opacity:.75}
.sqboard.shake{animation:shake .45s}
.sqcenter{position:absolute;inset:30.5%;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;
  box-shadow:0 0 0 4px var(--bg), 0 6px 18px rgba(0,0,0,.12)}
.sqcenter b{font-family:var(--f-display);font-size:clamp(28px,10vw,40px);font-weight:700;line-height:1;color:var(--ink)}
.sqcenter span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.sqplay{display:flex;flex-direction:column;gap:12px}
.sqmsg{min-height:2.6em;margin:0}
.sqbanner{border-radius:16px;padding:10px 14px;font-size:14px;text-align:center}
.sqbanner.rev{background:color-mix(in srgb, var(--c5) 30%, var(--surface));border:2px solid var(--c5)}
.sqbanner.new{background:color-mix(in srgb, var(--c6) 18%, var(--surface));border:2px solid var(--c6)}
.sqgoalbar{display:flex;flex-direction:column;gap:6px}
.sqgtxt{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.sqgoalbar .bar i{background:linear-gradient(90deg, var(--c6), var(--c3b))}
.sqctl{display:flex;justify-content:center}
.sqctl .help{min-width:160px}
.sqrevive{display:flex;gap:8px;width:100%}
.sqrevive .btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.sqrevive .btn small{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.sqrevive .btn small .coin{width:12px;height:12px}
.dstats.sqstats b{color:var(--c6)}
.sqgoal{margin:0}
.sqdots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:100%}
.sqdots i{width:14px;height:14px;border-radius:50%;animation:land .35s both;animation-delay:calc(var(--i) * 30ms)}
@media (prefers-reduced-motion: reduce){.sqboard.shake,.sqdots i{animation:none}}
.game.wide{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.game.wide > div:last-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mpts{position:relative;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-radius:18px;padding:10px 14px;background:var(--surface);border:2px solid var(--c4)}
.mpts span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mpts b{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--c4);line-height:1}
.mpts small{flex-basis:100%;font-size:12px;color:var(--muted)}
.mpts.low{border-color:var(--bad)} .mpts.low b{color:var(--bad)}
.mminus{position:absolute;right:16px;top:8px;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--bad)!important;letter-spacing:0!important;animation:minus .9s ease-out forwards}
@keyframes minus{from{transform:none;opacity:1}to{transform:translateY(-24px);opacity:0}}
.mscore{display:flex;flex-direction:column;align-items:center}
.mscore b{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;color:var(--ink)}
.mscore span{font-size:13px;color:var(--muted)}
.mtotal{margin:6px 0 0;font-weight:600}
.mtotal b{color:var(--c4);font-size:18px}
.mplay{display:flex;flex-direction:column;gap:12px}
.mq{border-radius:22px;padding:16px;color:var(--ink-on);background:linear-gradient(135deg, var(--c4), var(--c5));display:flex;flex-direction:column;gap:6px}
.mq .kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.mq h2{font-size:23px;font-weight:600;line-height:1.2}
.mq p{margin:0;font-size:14px;opacity:.95}
.mrange{display:flex;flex-direction:column;gap:6px}
.mtrack{position:relative;height:18px;border-radius:999px;background:var(--line)}
.mzone{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg, var(--c4), var(--c5));transition:left .4s, width .4s}
.mk{position:absolute;top:-4px;width:4px;height:26px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.mk.hint{background:var(--muted)}
.mends{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.mends .num{font-weight:700;color:var(--ink)}
.mfeed{display:flex;align-items:center;gap:14px;border-radius:20px;padding:14px;background:var(--surface);border:2px solid var(--line)}
.mfeed .arrow{width:60px;height:60px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:32px;font-weight:700;background:var(--bg);color:var(--muted)}
.mfeed div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mfeed b{font-family:var(--f-display);font-size:21px;font-weight:600}
.mfeed span{color:var(--muted);font-size:14px}
.mfeed.t-good,.mfeed.t-warn,.mfeed.t-bad{border-color:var(--tc)}
.mfeed.t-good .arrow,.mfeed.t-warn .arrow,.mfeed.t-bad .arrow{background:var(--tc);color:var(--on-tc)}
.mfeed.pop{animation:land .35s cubic-bezier(.2,1.5,.4,1) both}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:10px;height:44px;border-radius:14px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc)}
.mrow .num{font-weight:700;font-size:16px;flex:1}
.mdir{font-weight:600;font-size:14px}
.mfact{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--muted);text-align:left;width:100%;box-sizing:border-box}
.wordball small{font-size:.45em;font-weight:600}
.mchip b{background:var(--tc)!important;color:var(--on-tc)!important}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.howbtn{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;
  background:var(--surface);color:var(--accent);border:2px solid currentColor;box-shadow:0 3px 0 color-mix(in srgb, currentColor 25%, transparent)}
.howbtn:active{transform:translateY(2px);box-shadow:none}
.gwrap{position:relative;display:flex}
.gwrap > .game,.gwrap > .daycard{flex:1;min-width:0}
.gwrap.wide{grid-column:1 / -1}
.gwrap .daycard .kicker,.gwrap .game.wide h3{padding-right:46px}
.gwrap > .howbtn{position:absolute;top:12px;right:12px;z-index:2;background:rgba(255,255,255,.95);border:0;color:#2A2440}
.hud .howbtn{width:28px;height:28px;font-size:16px;border-width:2px}
.hudr{display:flex;align-items:center;gap:8px}
.howwrap{position:fixed;inset:0;z-index:30;background:rgba(13,18,34,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.howsheet{width:100%;max-width:480px;max-height:calc(100% - env(safe-area-inset-top, 0px) - 16px);overflow:auto;background:var(--surface);color:var(--ink);border-radius:26px;
  padding:0 18px 18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;animation:sheetup .3s cubic-bezier(.2,1.2,.4,1) both}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.howhead{margin:0 -18px;padding:20px 18px 18px;border-radius:26px 26px 0 0;color:var(--ink-on);background:linear-gradient(135deg, var(--hc), color-mix(in srgb, var(--hc) 60%, #FFC233));display:flex;flex-direction:column;gap:4px}
.howkicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.howhead h2{font-size:28px;font-weight:700}
.howhead p{margin:0;opacity:.95}
.howsteps{list-style:none;counter-reset:st;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.howsteps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;line-height:1.4}
.howsteps li::before{content:counter(st);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hc);color:var(--ink-on);font-family:var(--f-display);font-weight:700;font-size:17px}
.howsheet h3{font-size:16px;font-weight:600;margin-top:4px}
.howtips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted);line-height:1.4}
.howok{background:var(--hc)!important;border-color:var(--hc)!important;color:var(--ink-on)!important}
@media (prefers-reduced-motion: reduce){.howsheet{animation:none}}
.soon{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.soon div{border:2px dashed var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px}
.soon b{font-family:var(--f-display);font-size:17px;font-weight:600}
.soon span{font-size:12px;color:var(--muted)}

<script>
(function(){
const TOTAL_LEVELS = Infinity;   // los niveles no se terminan: la dificultad sigue subiendo
const ANSWER_TIME = 10;
const RANKS = [
  ["Novato",0],["Aprendiz",400],["Contador",1200],["Calculista",3000],["Veloz",6500],
  ["Experto",12000],["Maestro",22000],["Gran Maestro",40000],["Leyenda",75000],["Mente Infinita",130000]
];
const HELPS = {
  replay:{name:"Repetir", cost:30},
  time:{name:"+5 seg", cost:20},
  choices:{name:"3 opciones", cost:40}
};

/* ---------- guardado ---------- */
let S = {coins:100, xp:0, games:{cadena:{}}};
try{ const raw = localStorage.getItem("mentecuenta"); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
S.games = Object.assign({cadena:{}, escondida:{}}, S.games);
function save(){ try{ localStorage.setItem("mentecuenta", JSON.stringify(S)); }catch(e){} }

function rankInfo(){
  let i = 0; while(i < RANKS.length-1 && S.xp >= RANKS[i+1][1]) i++;
  const cur = RANKS[i], nxt = RANKS[i+1];
  const pct = nxt ? (S.xp-cur[1])/(nxt[1]-cur[1])*100 : 100;
  return {name:cur[0], n:i+1, pct, next:nxt};
}
const cleared = () => S.games.cadena;
function highest(store){ store = store || cleared(); let h=0; for(const k in store) h=Math.max(h,+k); return h; }

/* ---------- generador de niveles ---------- */
function cfg(L){
  return {
    count: L<=300 ? Math.min(3 + Math.floor((L-1)/7), 20) : Math.min(30, 20 + Math.floor((L-300)/40)),
    max: L<=10?9 : L<=30?15 : L<=60?25 : L<=110?50 : L<=180?99 : L<=240?250 : L<=400?999 : L<=600?2500 : 9999,
    min: L>110?10 : 1,
    ops: L<=5?["+"] : L<=40?["+","-"] : L<=90?["+","-","×"] : ["+","-","×","÷"],
    speed: L<=300 ? Math.max(520, 1650 - L*6) : Math.max(380, 520 - Math.floor((L-300)/5)),
    neg: L>70
  };
}
// generador con semilla: con la misma semilla salen las mismas cuentas (para los duelos)
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RAND = Math.random;
const rnd = (a,b)=> a + Math.floor(RAND()*(b-a+1));
function genLevel(L, seed){
  RAND = seed ? mulberry32(seed) : Math.random;
  try{ return genLevelRaw(L); } finally { RAND = Math.random; }
}
function genLevelRaw(L){
  const c = cfg(L);
  let total = rnd(Math.max(c.min,2), c.max);
  const items = [{op:"", n:total}];
  for(let i=1;i<c.count;i++){
    let op = c.ops[rnd(0,c.ops.length-1)], n;
    if(op==="×" && (Math.abs(total)>150 || total===0)) op="+";
    if(op==="÷"){
      const ds=[]; for(let d=2; d<=12; d++) if(total!==0 && total%d===0 && Math.abs(total)/d>=2) ds.push(d);
      if(ds.length){ n = ds[rnd(0,ds.length-1)]; total/=n; items.push({op,n}); continue; }
      op="-";
    }
    if(op==="×"){ n = rnd(2, L>200?12:9); total*=n; items.push({op,n}); continue; }
    if(op==="-" && !c.neg){
      if(total < 2){ op="+"; } else { n = rnd(1, Math.min(c.max,total)); total-=n; items.push({op,n}); continue; }
    }
    n = rnd(c.min, c.max);
    total = op==="+" ? total+n : total-n;
    items.push({op,n});
  }
  return {items, answer: total, cfg:c};
}
function stageLabel(s){
  const L = s*20+1, c = cfg(L), c2 = cfg(L+19);
  const ops = c2.ops.join(" ");
  return `${c.count}–${c2.count} números · hasta ${c2.max} · ${ops}`;
}
const STAGE_NAMES = ["Primeros pasos","Calentando","Restas en juego","Ritmo","Doble dígito","Entra el ×","Cadena larga","Sin red","Todo vale","Cuatro operaciones","Centenas","Velocidad","Mente fría","Elite","Leyenda","Miles","Turbo","Sin respiro","Maratón","Mente de acero"];

/* ---------- utilidades ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
let actx=null;
function beep(f=660,d=.06){ try{ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; g.gain.value=.06; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
function fmt(n){ return n<0 ? "−"+Math.abs(n) : String(n); }

function topBar(back){
  const r = rankInfo();
  return `<div class="top">
    ${back?`<button class="back" data-go="${back}" aria-label="Volver">←</button>`:""}
    <div class="rank">
      <div class="rank-name">${esc(r.name)}<small>Rango ${r.n} · <span class="num">${S.xp}</span> XP</small></div>
      <div class="bar"><i style="width:${r.pct}%"></i></div>
    </div>
    <div class="coins"><span class="coin"></span><span class="num">${S.coins}</span></div>
  </div>`;
}

/* ---------- pantallas ---------- */
let timers = [];
function clearTimers(){ if(Q){ Q.phase = Q.phase==="end" ? "end" : "off"; } const cf=document.getElementById("confetti"); if(cf) cf.remove(); timers.forEach(t=>{clearTimeout(t);clearInterval(t)}); timers=[]; stopMic(); }

function home(){
  clearTimers();
  const hc = highest(), hw = highest(S.games.escondida), hm = highest(S.games.mayor), hb = highest(S.games.bloques);
  const st = dailyStatus();
  let li = 0;
  const logo = "Mente Despierta".split(" ").map(w=>`<span class="lw">${[...w].map(c=>{ const i = li++; return `<span style="--i:${i};color:var(--c${i%5+1})">${c}</span>`; }).join("")}</span>`).join(" ");
  $app.innerHTML = `${topBar()}
  <div class="brand"><h1 class="logo" aria-label="Mente Despierta">${logo}</h1><p>Entrená la cabeza jugando un ratito por día.</p></div>
  <div class="gwrap">${howBtn("dia")}
  <button class="daycard" data-go="daily">
    <span class="kicker">Desafío del día · ${prettyDay(st.k)}</span>
    <h2>Palabra del día</h2>
    <p>${st.r ? (st.r.ok ? `¡La encontraste en ${st.r.t} ${st.r.t===1?"intento":"intentos"}! Mañana hay otra.` : "Hoy no salió. Mañana hay una palabra nueva.") : "Una palabra nueva, la misma para todos. ¿La descubrís?"}</p>
    <div class="row">
      <span class="chip">Racha: <b class="num">${st.streak}</b> ${st.streak===1?"día":"días"}</span>
      <span class="go">${st.r ? "Ver calendario" : "Jugar ahora"}</span>
    </div>
  </button></div>
  <h2 class="sec-title">Juegos</h2>
  <div class="games">
    <div class="gwrap">${howBtn("cadena")}<button class="game g-cadena" data-go="levels">
      <span class="bubble"></span>
      <div class="ic">5+6</div>
      <div><h3>Cadena</h3><p>Sumá, restá y multiplicá de cabeza mientras pasan los números.</p></div>
      <div class="prog"><span class="pbar"><i style="width:${hc%20/20*100}%"></i></span><span class="num">Nivel ${hc+1}</span></div>
    </button></div>
    <div class="gwrap">${howBtn("palabra")}<button class="game g-palabra" data-go="wlevels">
      <span class="bubble"></span>
      <div class="ic">A?</div>
      <div><h3>Palabra escondida</h3><p>Probá palabras y acercate a la secreta.</p></div>
      <div class="prog"><span class="pbar"><i style="width:${hw%20/20*100}%"></i></span><span class="num">Nivel ${hw+1}</span></div>
    </button></div>
  </div>
    <div class="gwrap wide">${howBtn("mayor")}<button class="game g-mayor wide" data-go="mlevels">
      <span class="bubble"></span>
      <div class="ic">↑↓</div>
      <div><h3>Mayor o menor</h3><p>Adiviná el dato: años, metros, cantidades. Te decimos si es más o menos.</p>
      <div class="prog"><span class="pbar"><i style="width:${hm%20/20*100}%"></i></span><span class="num">Nivel ${hm+1} · ${mFmt(mTotal())} pts</span></div></div>
    </button></div>
    <div class="gwrap wide">${howBtn("secuencia")}<button class="game g-secuencia wide" data-go="secuencia">

      <div class="ic sqic"><i style="background:#22C55E"></i><i style="background:#EF4444"></i><i style="background:#3B82F6"></i><i style="background:#FACC15"></i></div>
      <div><h3>Secuencia</h3><p>Repetí la secuencia de luces y sonidos. Cada acierto suma una luz más.</p>
      <div class="prog"><span class="pbar"><i style="width:${S.simon.best ? Math.min(100, S.simon.best/((sqNextGoal(S.simon.best)||{at:S.simon.best}).at)*100) : 0}%"></i></span><span class="num">${S.simon.best ? `Récord ${mFmt(S.simon.best)} pts` : "¡Probalo!"}</span></div></div>
    </button></div>
    <div class="gwrap wide">${howBtn("bloques")}<button class="game g-bloques wide" data-go="blevels">
      <span class="bubble"></span>
      <div class="ic bkic"><i class="a"></i><i class="b"></i><i class="c"></i></div>
      <div><h3>Bloques deslizantes</h3><p>Deslizá los bloques y sacá el rojo por la salida.</p>
      <div class="prog"><span class="pbar"><i style="width:${hb%20/20*100}%"></i></span><span class="num">Nivel ${hb+1}</span></div></div>
    </button></div>
  </div>
`;
}

/* mapa de niveles: un camino en zigzag, con un cartel de color al empezar cada etapa */
const STAGE_COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c6)","var(--c4)","var(--c7)","var(--c2b)","var(--c3)"];
const PATH_X = [50, 70, 80, 70, 50, 30, 20, 30];          // posición horizontal (%) de cada nivel en el zigzag
const NODE_H = 72;                                        // alto de cada escalón del camino (px)
const LOCK_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>`;
function pathD(pts){
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){ const [x0,y0] = pts[i-1], [x1,y1] = pts[i], my = (y0+y1)/2; d += ` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`; }
  return d;
}
function levelMap(o){
  clearTimers();
  const h = highest(o.store), stages = Math.ceil(o.total/20);
  let html = `${topBar("home")}<div class="hello"><div class="titlerow"><h1>${o.title}</h1>${o.how?howBtn(o.how):""}</div><p>${o.desc}</p></div><div class="lbox"><div class="lmap" id="lmap">`;
  for(let s=0; s<stages; s++){
    const first = s*20+1, last = Math.min(o.total, s*20+20), color = STAGE_COLORS[s % STAGE_COLORS.length];
    const name = o.names[s] || o.names[s % o.names.length] + " " + (Math.floor(s/o.names.length)+1);
    if(first > h+21 && s>0){
      html += `<div class="lend" style="--sc:${color}">${LOCK_SVG}<div><b>${isFinite(stages)?`Etapa ${s+1} a ${stages}`:`Etapa ${s+1} y más`}</b><span>${isFinite(stages)?"Se desbloquean a medida que avanzás.":"Los niveles no se terminan nunca: siempre hay uno más."}</span></div></div>`;
      break;
    }
    let done = 0, stars = 0;
    for(let L=first; L<=last; L++) if(o.store[L]!==undefined){ done++; stars += o.store[L]||0; }
    const n = last - first + 1, locked = first > h+1;
    html += `<section class="lstage" style="--sc:${color}">
      <div class="lbanner ${locked?"locked":""}">
        <span class="lkick">Etapa ${s+1}</span>
        <h2>${esc(name)}</h2>
        <span class="lsub">${o.label(s)}</span>
        <div class="lprog"><span class="lbar"><i style="width:${done/n*100}%"></i></span><span class="num">${done}/${n}</span><span class="lstars">★ <span class="num">${stars}</span></span></div>
      </div>`;
    // camino
    const pts = [], nodes = [];
    let lastDone = -1;
    for(let j=0; j<n; j++){
      const L = first + j, x = PATH_X[(s*20+j) % PATH_X.length], y = j*NODE_H + NODE_H/2;
      pts.push([x, y]);
      const st = o.store[L];
      if(st!==undefined){ lastDone = j;
        nodes.push(`<button class="lvn done" data-${o.attr}="${L}" style="left:${x}%;top:${y}px" aria-label="Nivel ${L}, ${st} ${st===1?"estrella":"estrellas"}"><b class="num">${L}</b><span class="lst">${st?`${"★".repeat(st)}<i>${"★".repeat(3-st)}</i>`:"–"}</span></button>`);
      } else if(L===h+1){
        nodes.push(`<button class="lvn next" data-${o.attr}="${L}" style="left:${x}%;top:${y}px" aria-label="Nivel ${L}, jugar"><b class="num">${L}</b><span class="lgo">JUGAR</span></button>`);
      } else {
        nodes.push(`<button class="lvn lock" disabled style="left:${x}%;top:${y}px" aria-label="Nivel ${L} bloqueado">${LOCK_SVG}<span class="lnum num">${L}</span></button>`);
      }
    }
    const H = n*NODE_H, reach = Math.min(n-1, lastDone + (h+1 >= first && h+1 <= last ? 1 : 0));
    html += `<div class="lpath" style="height:${H}px">
      <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">
        <path class="lroad" d="${pathD(pts)}"/>
        ${reach>0?`<path class="lroad on" d="${pathD(pts.slice(0, reach+1))}"/>`:""}
      </svg>${nodes.join("")}</div></section>`;
  }
  $app.innerHTML = html + `</div></div><p class="lhint">Deslizá dentro del camino para ver más niveles</p>`;
  // el camino muestra un tramo corto: se centra en el próximo nivel y el resto se ve deslizando
  const box = document.getElementById("lmap"), nx = $app.querySelector(".lvn.next");
  if(box && nx){ const go = () => { const r = nx.getBoundingClientRect(), b = box.getBoundingClientRect(); box.scrollTop += (r.top + r.height/2) - (b.top + b.height*0.58); }; go(); requestAnimationFrame(go); }
  if(o.how) howFirst(o.how);
}

  G = Object.assign(genLevel(L, duel ? duel.seed + duel.round*101 : 0), {L, input:"", extra:0, used:{}, phase:"show", duel:duel||null});

    <div class="stagebox" id="box"></div>
    <div id="bottom"></div>
  </div>`;
  showSequence();

function showSequence(){
  G.phase="show";
  const box = document.getElementById("box");
  document.getElementById("bottom").innerHTML = `<p class="hint">Mirá y calculá en tu cabeza…</p>`;
  box.innerHTML = `<div class="big" id="big"><span class="cue">Preparado…</span></div><div class="dots">${G.items.map(()=>"<i></i>").join("")}</div>`;
  const big = document.getElementById("big"); big.style.fontSize="48px";
  let i = 0; const sp = G.cfg.speed;
  const opT = Math.round(sp*0.38);
  const showNum = (it, idx) => {
    const len = String(it.n).length;
    big.style.fontSize="";
    big.innerHTML = `<span class="disc num len${Math.min(len,4)}">${it.n}</span>`;
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    box.querySelectorAll(".dots i")[idx].classList.add("on");
    beep(520 + idx*25);
    const t = idx===0 ? sp : sp-opT;
    timers.push(setTimeout(()=>{ big.innerHTML="&nbsp;"; timers.push(setTimeout(step, 110)); }, t-110));
  };
  const step = () => {
    if(i >= G.items.length){ askAnswer(); return; }
    const it = G.items[i], idx = i; i++;
    if(!it.op){ showNum(it, idx); return; }
    big.style.fontSize="";
    big.innerHTML = `<span class="opsign">${it.op==="-"?"−":it.op}</span>`;
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    beep(330,.04);
    timers.push(setTimeout(()=>showNum(it, idx), opT));
  };
  timers.push(setTimeout(()=>{
    big.style.fontSize="";
    big.innerHTML = `<span class="cue go">¡Listo!</span>`;
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    beep(440,.08);
    timers.push(setTimeout(()=>{ big.innerHTML="&nbsp;"; timers.push(setTimeout(step, 150)); }, 750));
  }, 1100));
}
function askAnswer(){
  G.phase="answer"; G.input=""; G.t0=performance.now();

  box.innerHTML = `<p class="hint">¿Cuánto da?</p><div class="answer empty" id="ans">?</div>
    <p class="hint" id="micst">Escribí el resultado o tocá el micrófono</p>
    <div class="timer" id="timer" style="width:100%"><i id="tbar"></i></div>`;
  renderBottom();
  const tick = () => {
    const total = ANSWER_TIME + G.extra;
    const left = total - (performance.now()-G.t0)/1000;
    const tb = document.getElementById("tbar"); if(!tb) return;
    tb.style.width = Math.max(0,left/total*100)+"%";
    document.getElementById("timer").classList.toggle("warn", left<3);
    if(left<=0){ finish(null); }
  };
  timers.push(setInterval(tick, 50));
}
function renderBottom(){
  const b = document.getElementById("bottom");

function setInput(v){

}
function useHelp(k){
  const h = HELPS[k]; if(G.used[k] || S.coins < h.cost) return;
  S.coins -= h.cost; G.used[k]=true; save();
  document.querySelector(".coins .num").textContent = S.coins;
  if(k==="time"){ G.extra += 5; toast("Tenés 5 segundos más"); renderBottom(); }
  if(k==="choices"){
    const set = new Set([G.answer]);
    while(set.size<3){ const d = rnd(1, Math.max(3, Math.min(12, Math.ceil(Math.abs(G.answer)*.15)))); set.add(G.answer + (Math.random()<.5?-d:d)); }
    G.choices = [...set].sort(()=>Math.random()-.5); renderBottom();
  }

}
function finish(val){
  if(G.phase!=="answer") return;
  G.phase="done"; clearTimers();
  const ok = val!==null && val===G.answer;
  const used = (performance.now()-G.t0)/1000, total = ANSWER_TIME+G.extra;
  if(G.duel) return cDuelRound(ok, val, used);
  let stars=0, coins=0, xp=0;
  if(ok){
    stars = used <= total*.4 ? 3 : used <= total*.7 ? 2 : 1;
    if(Object.keys(G.used).length) stars = Math.min(stars, 2);
    const prev = cleared()[G.L]||0;
    coins = stars*3 + (prev?0:5) + Math.floor(G.L/10);
    xp = (8 + G.L) * stars + (prev?0:20);
    if(stars>prev) cleared()[G.L]=stars;
    S.coins += coins; S.xp += xp; save();
    beep(880,.12); setTimeout(()=>beep(1175,.15),130);
  } else beep(220,.25);
  const diff = val===null ? null : val - G.answer;
  const tol = Math.max(2, Math.round(Math.abs(G.answer)*0.1));
  const mood = ok ? "good" : (diff!==null && Math.abs(diff)<=tol) ? "warn" : "bad";
  const title = ok ? "¡Correcto!" : mood==="warn" ? "¡Uy, casi!" : val===null ? "Se acabó el tiempo" : "Incorrecto";
  const sub = ok ? `Respondiste en <b class="num">${used.toFixed(1)}</b> s`
    : mood==="warn" ? `Te ${diff<0?"faltaron":"sobraron"} <b class="num">${Math.abs(diff)}</b>. ¡Estuviste cerca!`
    : val===null ? "No llegaste a responder" : `Te equivocaste por <b class="num">${Math.abs(diff)}</b>`;
  const sym = o => o==="-" ? "−" : o;
  let k = 0, chain = "";
  G.items.forEach((it,i)=>{
    if(it.op) chain += `<span class="sign" style="--i:${k++}">${sym(it.op)}</span>`;
    chain += `<span class="ball" style="--i:${k++}">${it.n}</span>`;
  });
  chain += `<span class="sign eq" style="--i:${k++}">=</span><span class="ball final" style="--i:${k++}">${fmt(G.answer)}</span>`;
  $app.innerHTML = `${topBar("levels")}
  <div class="result mood-${mood}">
    <div class="verdict">
      <h1>${title}</h1>
      <p>${sub}</p>
      <div class="duel">
        <div class="who"><div class="ball hero ${val===null?"empty":""}">${val===null?"?":fmt(val)}</div>Tu respuesta</div>
        ${ok?"":`<div class="who"><div class="ball hero truth">${fmt(G.answer)}</div>Resultado</div>`}
      </div>
      ${ok?`<div class="stars" aria-label="${stars} de 3 estrellas">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>`:""}
    </div>
    ${ok?`<div class="gains"><span><span class="coin"></span>+<span class="num">${coins}</span></span><span>+<span class="num">${xp}</span> XP</span></div>`:""}
    ${ok && Object.keys(G.used).length?`<p class="hint">Con ayudas, el máximo es 2 estrellas.</p>`:""}
    <div class="chainbox"><h2>La cuenta</h2><div class="chain">${chain}</div></div>
    <div class="actions">
      ${ok && G.L<TOTAL_LEVELS?`<button class="btn primary" data-lv="${G.L+1}">Nivel ${G.L+1}</button>`:""}
      <button class="btn ${ok?"":"primary"}" data-lv="${G.L}">${ok?"Repetir nivel":"Intentar de nuevo"}</button>
      <button class="btn" data-go="levels">Ver niveles</button>
    </div>
  </div>`;
  if(ok) confetti();
}

function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.id="confetti"; document.body.appendChild(c);
  const dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight;
  c.width = W*dpr; c.height = H*dpr; const x = c.getContext("2d"); x.scale(dpr,dpr);
  const css = getComputedStyle(document.documentElement);
  const cols = ["--good","--warn","--bad","--accent","--coin"].map(v=>css.getPropertyValue(v).trim());
  const P = Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*80,y:H*.3,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,
    r:4+Math.random()*5,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],round:Math.random()<.4}));
  const t0 = performance.now();
  (function f(t){
    x.clearRect(0,0,W,H);
    for(const p of P){ p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.r/1.6,0,7);x.fill();} else x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);
      x.restore(); }
    if(t-t0<2200 && document.body.contains(c)) requestAnimationFrame(f); else c.remove();
  })(t0);
}

const W_STAGES = ["Cosas de todos los días","Lugares y objetos","Ideas y emociones","Animales y comida","Casa y ciudad","Más específicas","Naturaleza y cultura","Sentimientos","Grandes ideas","Expertos"];

/* vocabulario: cada palabra con sus subcategorías (dominio/categoría/sub + posición) y etiquetas */
const VOCAB = []; const VIDX = new Map();
function vFind(n){
  if(VIDX.has(n)) return VIDX.get(n);
  for(const k of singulars(n)) if(VIDX.has(k)) return VIDX.get(k);
  for(const k of plurals(n)) if(VIDX.has(k)) return VIDX.get(k);
  return -1;
}
function vAdd(w, mem, tags){
  const n = norm(w); if(n.length<2 || STOP.has(n)) return -1;
  let i = vFind(n);
  if(i<0){ i = VOCAB.length; VOCAB.push({w, n, mem:[], tags:new Set()}); VIDX.set(n, i); }
  const e = VOCAB[i];
  if(mem && !e.mem.some(m=>m.s===mem.s)) e.mem.push(mem);
  if(tags) tags.forEach(t=>e.tags.add(t));
  return i;
}
(window.__vocab||[]).forEach(text=>{
  for(const line of text.split("\n")){
    const m = line.match(/^\s*([^|#]+)\|([^:]+):\s*(.+)$/); if(!m) continue;
    const path = m[1].trim().split("/"), tags = m[2].split(",").map(t=>t.trim()).filter(Boolean);
    const sKey = path.join("/"), cKey = path.slice(0,2).join("/"), dKey = path[0];
    m[3].trim().split(/\s+/).forEach((w,pos)=>vAdd(w, {d:dKey, c:cKey, s:sKey, pos}, tags));
  }
});

function listIdx(text){ const out=[]; const seen=new Set();

CURATED.forEach(T=>{ const sec = VOCAB[T.si];

const AFIN = {animales:"plantas naturaleza lugares comida", plantas:"animales naturaleza comida", comida:"plantas hogar cuerpo salud",
  cuerpo:"salud acciones ropa deporte", salud:"cuerpo personas", personas:"sociedad mente hogar", hogar:"construcción comida ropa personas",
  construcción:"hogar lugares", ropa:"cuerpo hogar", lugares:"naturaleza transporte sociedad", transporte:"lugares tecnología",
  naturaleza:"lugares animales plantas tiempo colores", tiempo:"naturaleza mente", tecnología:"comunicación ciencia transporte",
  cultura:"deporte mente educación sociedad", deporte:"cultura cuerpo", educación:"ciencia cultura comunicación", ciencia:"educación matemática tecnología naturaleza",
  matemática:"ciencia educación medidas", colores:"cultura naturaleza", medidas:"matemática ciencia", sociedad:"personas mente cultura",
  mente:"sociedad comunicación personas", comunicación:"mente tecnología sociedad", acciones:"cuerpo personas"};
const near = (a,b) => (AFIN[a]||"").split(" ").includes(b) || (AFIN[b]||"").split(" ").includes(a);
// palabras que nombran la categoría o una etiqueta de la escondida ("animal", "ave", "fruta", "selva"…)
function namesOf(sec){ const set = new Map();
  const add = (w, v) => { const i = vFind(norm(w)); if(i>=0 && (set.get(i)||0) < v) set.set(i, v); };
  sec.mem.forEach(m=>{ const p = m.s.replace("~","").split("/"); add(p[0], 110); add(p[1], 140); add(p[2], 160); });
  sec.tags.forEach(t=>add(t, 110));
  return set; }
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); }
function wScore(sec, x, salt, nameBonus){
  let s = 0, same = false;
  for(const a of sec.mem) for(const b of x.mem){
    let v = 0;
    if(a.s===b.s){ v = 300 + Math.max(0, 60 - Math.abs(a.pos-b.pos)*3); same = true; }
    else if(a.c===b.c) v = 180; else if(a.d===b.d) v = 90; else if(near(a.d,b.d)) v = 40;
    if(v>s) s=v;
  }
  for(const t of x.tags) if(sec.tags.has(t)) s += 45;
  if(x.tags.has(sec.n)) s += 120;
  if(!same) s += nameBonus||0;   // "animal", "ave"… suman solo si no están ya en la misma subcategoría
  return s + (hash(salt + x.n) % 25);
}
/* calcula el puesto de TODAS las palabras del vocabulario para un nivel */
function wRanking(lv){
  const sec = VOCAB[lv.si], salt = sec.n + "|";
  const posA = new Map(lv.A.map((i,k)=>[i,k])), posB = new Map(lv.B.map((i,k)=>[i,k]));
  // vía otras palabras escondidas con lista: si X está cerca de T y T está cerca de la escondida
  const names = namesOf(sec);
  const via = new Map();
  for(const [ti, T] of CURATED){
    const rt = posA.has(ti) ? posA.get(ti) : posB.has(ti) ? 60 + posB.get(ti) : null;
    if(rt===null) continue;
    T.A.forEach((xi,k)=>{ const v = 260 - (rt + k)*2; if(v>(via.get(xi)||0)) via.set(xi, v); });
  }
  const keyed = [];
  VOCAB.forEach((x,i)=>{
    if(i===lv.si) return;
    let k;
    if(posA.has(i)) k = 1e6 - posA.get(i);
    else if(posB.has(i)) k = 5e5 - posB.get(i);
    else k = wScore(sec, x, salt, names.get(i)) + (via.get(i)||0);
    keyed.push([k, i]);
  });
  keyed.sort((a,b)=>b[0]-a[0]);
  const rank = new Map([[lv.si, 1]]); const order = [lv.si];
  keyed.forEach(([,i],j)=>{ rank.set(i, j+2); order.push(i); });
  return {rank, order};
}
const tierOf = r => r<=50 ? "good" : r<=300 ? "warn" : "bad";

/* orden de las palabras: distinto para cada jugador, mezclado dentro de cada tramo de dificultad */
const W_TIERS = [[1,20],[21,40],[41,60],[61,100],[101,150],[151,WDATA.length]];
if(!S.wseed){ S.wseed = 1 + Math.floor(Math.random()*2147483646); save(); }
const W_ORDER = [];
W_TIERS.forEach(([a,b],k)=>{
  const idx = []; for(let i=a-1; i<Math.min(b, WDATA.length); i++) idx.push(i);
  const r = mulberry32(S.wseed + k*7919);
  for(let i=idx.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [idx[i],idx[j]] = [idx[j],idx[i]]; }
  idx.forEach((v,j)=>{ W_ORDER[a-1+j] = v; });
});
const wTier = L => W_TIERS.find(([a,b])=>L>=a && L<=b) || W_TIERS[0];
/* niveles sin fin: después de los 200 niveles armados, cualquier sustantivo del vocabulario puede ser la escondida */
const WPOOL = (()=>{
  const used = new Set(WDATA.map(l=>l.si));
  const skipDom = new Set(["acciones"]);
  return VOCAB.map((v,i)=>i).filter(i=>{
    const v = VOCAB[i];
    if(used.has(i) || v.n.length < 4 || v.inferred) return false;
    if(!v.mem.length || v.mem.some(m=>skipDom.has(m.d) || /acciones|cualidades|sabores|medidas|números/.test(m.s))) return false;
    if(/(ar|er|ir)$/.test(v.n) && !/(lugar|mar|altar|collar|azúcar|azucar|mujer|placer|taller|alfiler|cráter|crater|bar|hogar|dólar|dolar|militar|nivel)$/.test(v.n)) return false;
    return true;
  });
})();
const W_CYCLES = {};
function wIdxFor(L){
  if(L <= WDATA.length) return W_ORDER[L-1];
  const n = L - WDATA.length - 1, P = WPOOL.length, c = Math.floor(n / P);
  if(!W_CYCLES[c]){ const idx = [...Array(P).keys()]; const r = mulberry32(S.wseed + 50000 + c*7919);
    for(let i=idx.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [idx[i],idx[j]] = [idx[j],idx[i]]; } W_CYCLES[c] = idx; }
  return WDATA.length + W_CYCLES[c][n % P];
}
const W_EXTRA = {};
function wLv(idx){
  if(idx < WDATA.length) return WDATA[idx];
  const vi = WPOOL[idx - WDATA.length]; if(vi===undefined) return null;
  return W_EXTRA[idx] || (W_EXTRA[idx] = {w:VOCAB[vi].w, si:vi, A:[], B:[]});
}
function wPractice(L){

}

const HINT_COST = [30, 50, 80, 120];
function wHint(){
  if(!W || W.done) return;
  const cost = HINT_COST[Math.min(W.hints, HINT_COST.length-1)];
  if(S.coins < cost){ toast(`Necesitás ${cost} monedas para esta pista.`); return; }
  const best = Math.min(...W.guesses.map(g=>g.r), Infinity);
  if(best <= 10){ toast("Ya estás muy cerca: esta vez no hay pista. ¡Vos podés!"); return; }
  // la pista te acerca un poco, nunca demasiado
  const target = best===Infinity ? 250 : best > 300 ? Math.round(best*0.6) : best > 50 ? Math.round(best*0.75) : best - Math.max(2, Math.round(best*0.25));
  const floor = Math.max(8, Math.min(target, best-1));
  const used = new Set(W.guesses.map(g=>g.i));
  let pick = -1;
  for(let r = Math.max(target, 8); r < Math.min(best, W.order.length+1); r++){ const i = W.order[r-1]; if(!used.has(i)){ pick = i; break; } }
  if(pick<0) for(let r = Math.max(target, 8)-1; r >= floor; r--){ const i = W.order[r-1]; if(!used.has(i)){ pick = i; break; } }
  if(pick<0){ toast("No hay más pistas para esta palabra."); return; }

  const hc = document.getElementById("whcost"); if(hc) hc.textContent = HINT_COST[Math.min(W.hints, HINT_COST.length-1)];
  wAdd({word:VOCAB[pick].w, r:W.rank.get(pick), i:pick, hint:true});
}

// El desafío viaja en un código (o link) que incluye la palabra (como número de nivel) y la marca de cada jugador.
const DUEL_KEY = "mentecuenta-duelo";
S.duel = Object.assign({w:0, e:0, l:0, seen:[]}, S.duel);
function duelEncode(p){
  const bytes = new TextEncoder().encode(JSON.stringify(p));
  let bin = ""; bytes.forEach((b,i)=>{ bin += String.fromCharCode(b ^ DUEL_KEY.charCodeAt(i % DUEL_KEY.length)); });
  return "duelo-" + btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function duelDecode(text){
  const m = String(text||"").match(/duelo-([A-Za-z0-9_-]+)/); if(!m) return null;
  try{
    const bin = atob(m[1].replace(/-/g,"+").replace(/_/g,"/"));
    const bytes = Uint8Array.from(bin, (c,i)=>c.charCodeAt(0) ^ DUEL_KEY.charCodeAt(i % DUEL_KEY.length));
    const p = JSON.parse(new TextDecoder().decode(bytes));
    if(p.v!==1 || !p.a) return null;
    if(p.g==="c"){ if(!(p.L>=1 && p.L<=TOTAL_LEVELS) || !p.seed) return null; }
    else if(!wLv(p.w)) return null;
    return p;
  }catch(e){ return null; }
}
const canLink = (()=>{ try{ return window.top === window && /^https?:$/.test(location.protocol); }catch(e){ return false; } })();
function duelLink(token){ return canLink ? location.origin + location.pathname + "#" + token : ""; }
// gana quien la encontró; entre dos que la encontraron, menos intentos; si empatan, menos pistas
function duelCompare(a, b){
  if(a.ok && !b.ok) return 1; if(!a.ok && b.ok) return -1; if(!a.ok && !b.ok) return 0;
  if(a.t !== b.t) return a.t < b.t ? 1 : -1;
  if(a.h !== b.h) return a.h < b.h ? 1 : -1;
  return 0;
}

  if(a.ok !== b.ok) return a.ok > b.ok ? 1 : -1;

}

// La misma palabra para todos en la misma fecha. Se juega igual que Palabra escondida.
const DAY0 = Date.UTC(2026, 0, 1);
const DAILY_START = "2026-10-01";              // primer día del calendario
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
S.daily = S.daily || {};
S.dailyBest = S.dailyBest || 0;
const pad2 = n => String(n).padStart(2,"0");
const dayKey = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const keyDate = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const dayNum = k => { const [y,m,d] = k.split("-").map(Number); return Math.round((Date.UTC(y,m-1,d) - DAY0) / 864e5); };
const todayKey = () => dayKey(new Date());
const prettyDay = k => { const d = keyDate(k); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const DAILY_POOL = (()=>{ const idx = [...Array(WDATA.length).keys()]; const r = mulberry32(20261001);
  for(let i=idx.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [idx[i],idx[j]] = [idx[j],idx[i]]; } return idx; })();
const dailyIdx = k => { const n = dayNum(k), L = DAILY_POOL.length; return DAILY_POOL[((n % L) + L) % L]; };

function dailyStreak(){
  let k = todayKey(), n = 0;
  if(!(S.daily[k] && S.daily[k].ok && !S.daily[k].late)){ const d = keyDate(k); d.setDate(d.getDate()-1); k = dayKey(d); }
  // solo cuentan los días jugados en su fecha (no los recuperados del calendario)
  while(S.daily[k] && S.daily[k].ok && !S.daily[k].late){ n++; const d = keyDate(k); d.setDate(d.getDate()-1); k = dayKey(d); }
  return n;
}
function dailyStatus(){
  const k = todayKey(), r = S.daily[k];
  return {k, r, streak: dailyStreak()};
}

function calendarHtml(){
  const {y, m} = calMonth;
  const first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;     // la semana empieza el lunes
  const tk = todayKey();
  const startM = keyDate(DAILY_START), now = new Date();
  const canPrev = y > startM.getFullYear() || (y === startM.getFullYear() && m > startM.getMonth());
  const canNext = y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth());

      : `<button class="${cls}" data-daily="day:${k}" aria-label="${label}">${d}${sub?`<small>${sub}</small>`:""}</button>`;
  }
  return `<div class="cal">

      <button class="calnav" data-daily="prev" ${canPrev?"":"disabled"} aria-label="Mes anterior">‹</button>

  </div>`;
}

// Una pregunta con respuesta numérica. Cada número que probás te dice si el dato es mayor o menor.
const MDATA = (window.__mayor||[]).map(x=>Object.assign({tol:0, u:"", n:""}, x));
S.games.mayor = S.games.mayor || {};
// orden distinto para cada jugador, mezclado dentro de cada dificultad
const M_ORDER = [];
const M_TIERS = [];
[1,2,3].forEach(d=>{
  const idx = MDATA.map((x,i)=>x.d===d?i:-1).filter(i=>i>=0);
  const r = mulberry32((S.wseed||1) + d*104729);
  for(let i=idx.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [idx[i],idx[j]] = [idx[j],idx[i]]; }
  M_TIERS.push([M_ORDER.length+1, M_ORDER.length+idx.length]);
  M_ORDER.push(...idx);
});
const M_STAGES = ["Para entrar en calor","Números de todos los días","Fechas y cantidades","Historia y deporte","Datos curiosos","Para expertos","Solo para cracks"];
const mFmt = n => Number(n).toLocaleString("es-AR").replace("-", "−");
// cuántos intentos haría falta yendo siempre a la mitad
const mPar = x => Math.max(1, Math.ceil(Math.log2((x.hi - x.lo) / (2*x.tol + 1) + 1)));
const M_HINT_COST = [30, 50, 80];
// puntaje: arrancás con 1000 y cada número que no es la respuesta descuenta puntos (más en las preguntas de rango chico)
const M_START = 1000, M_MIN = 50;
const mPenalty = par => Math.max(25, Math.round(M_START / (2*par + 2)));
S.mbest = S.mbest || {};
const mTotal = () => Object.values(S.mbest).reduce((s,v)=>s+v, 0);

function mlevels(){
  levelMap({title:"Mayor o menor", desc:"Te hacemos una pregunta con respuesta numérica. Probá números: te decimos si el dato es mayor o menor hasta que lo encuentres.",
    store:S.games.mayor, total:Infinity, names:M_STAGES, attr:"mlv", how:"mayor",
    label:s=>{ const L = s*20+1; if(L > MDATA.length) return "preguntas nuevas: fechas, cuentas y tiempo"; const t = M_TIERS.findIndex(([a,b])=>L>=a && L<=b); return ["preguntas fáciles","fechas y datos","datos difíciles"][Math.max(0,t)] + " · 3 estrellas yendo a la mitad"; }});
  const h = $app.querySelector(".hello"); if(h) h.insertAdjacentHTML("beforeend", `<p class="mtotal">Tu puntaje total: <b class="num">${mFmt(mTotal())}</b> puntos</p>`);
}

let M = null;
function mplay(L){
  clearTimers(); G = null; W = null;
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  const x = mQuestion(L);
  M = {L, x, lo:x.lo, hi:x.hi, guesses:[], hints:0, done:false, par:mPar(x), pts:M_START};
  M.pen = mPenalty(M.par);
  $app.innerHTML = `${topBar("mlevels")}
  <div class="mplay">
    <div class="mpts" id="mpts"><span>Puntos</span><b class="num" id="mptsv">${mFmt(M.pts)}</b><small>cada número que no es la respuesta resta ${M.pen}</small></div>
    <div class="hud"><span>Nivel <b>${L}</b></span><span class="hudr"><span>Intentos: <b id="mcount">0</b> · ideal: <b>${M.par}</b></span>${howBtn("mayor")}</span></div>
    <div class="mq">
      <span class="kicker">Pregunta</span>
      <h2>${esc(x.q)}</h2>
      <p>La respuesta está entre <b class="num">${mFmt(x.lo)}</b> y <b class="num">${mFmt(x.hi)}</b>${x.u?` ${esc(x.u)}`:""}.${x.tol?` Se acepta un margen de ±${mFmt(x.tol)}.`:""}</p>
    </div>
    <div class="mrange" id="mrange"></div>
    <div id="mfeed" class="mfeed"><span class="arrow">?</span><div><b>Probá un número</b><span>Empezar por la mitad del rango suele ser la mejor idea.</span></div></div>
    <form class="wform" id="mform" autocomplete="off">
      <input id="mguess" type="text" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Tu número" aria-label="Tu número">

      <button class="help" data-mhelp>Pista<small><span class="coin"></span><span id="mhcost">${M_HINT_COST[0]}</span></small></button>

  document.getElementById("mform").addEventListener("submit", e=>{ e.preventDefault(); mGuess(document.getElementById("mguess").value); });

function mRender(){
  document.getElementById("mcount").textContent = M.guesses.filter(g=>!g.hint).length;
  const x = M.x, span = x.hi - x.lo || 1;
  const pos = v => Math.max(0, Math.min(100, (v - x.lo) / span * 100));
  const marks = M.guesses.map(g=>`<i class="mk ${g.hint?"hint":""}" style="left:${pos(g.v)}%"></i>`).join("");
  document.getElementById("mrange").innerHTML = `
    <div class="mtrack"><span class="mzone" style="left:${pos(M.lo)}%;width:${pos(M.hi)-pos(M.lo)}%"></span>${marks}</div>
    <div class="mends"><span class="num">${mFmt(M.lo)}</span><span>la respuesta está acá</span><span class="num">${mFmt(M.hi)}</span></div>`;
  const list = [...M.guesses].reverse();
  document.getElementById("mlist").innerHTML = list.map(g=>`<li class="mrow t-${g.tier}">
    <span class="num">${mFmt(g.v)}</span>${g.hint?`<span class="wtag">pista</span>`:""}
    <span class="mdir">${g.dir>0?"Es mayor ↑":g.dir<0?"Es menor ↓":"¡Justo!"}</span></li>`).join("");
}
function mTier(v){
  const x = M.x, rel = Math.abs(v - x.a) / ((x.hi - x.lo) || 1);
  return rel <= .03 ? "good" : rel <= .15 ? "warn" : "bad";
}
function mParse(text){
  let t = String(text).toLowerCase().trim();
  const neg = /^-|^−|menos/.test(t);
  t = t.replace(/[.\s]/g,"").replace(",", ".");
  const m = t.match(/\d+(\.\d+)?/); if(!m) return null;
  const v = Math.round(parseFloat(m[0]));
  return neg ? -v : v;
}
function mGuess(text){
  if(!M || M.done) return;
  const inp = document.getElementById("mguess");
  const v = mParse(text);
  if(v === null){ toast("Escribí un número."); return; }
  if(M.guesses.some(g=>g.v===v && !g.hint)){ toast(`Ya probaste ${mFmt(v)}.`); if(inp) inp.value=""; return; }
  const x = M.x, hit = Math.abs(v - x.a) <= x.tol;
  const dir = hit ? 0 : (x.a > v ? 1 : -1);
  if(!hit){ if(dir>0) M.lo = Math.max(M.lo, v+1); else M.hi = Math.min(M.hi, v-1); }
  const g = {v, dir, tier: hit ? "good" : mTier(v), hint:false};
  M.guesses.push(g);
  if(!hit) mLose(M.pen);
  if(inp){ inp.value=""; refocus(inp); }
  const f = document.getElementById("mfeed");
  f.className = `mfeed t-${g.tier} ${hit?"win":dir>0?"up":"down"}`;
  f.innerHTML = hit ? `<span class="arrow">✓</span><div><b>¡Es ${mFmt(v)}!</b><span>Encontraste el dato.</span></div>`
    : `<span class="arrow">${dir>0?"↑":"↓"}</span><div><b>Es ${dir>0?"MAYOR":"MENOR"} que ${mFmt(v)}</b><span>${g.tier==="good"?"¡Estás muy cerca!":g.tier==="warn"?"Estás cerca.":"Todavía estás lejos."}</span></div>`;
  f.classList.remove("pop"); void f.offsetWidth; f.classList.add("pop");
  beep(hit?880:g.tier==="good"?760:g.tier==="warn"?560:330, .07);
  mRender();
  if(hit) timers.push(setTimeout(()=>mEnd(true), 600));
}
function mHint(){
  if(!M || M.done) return;
  const cost = M_HINT_COST[Math.min(M.hints, M_HINT_COST.length-1)];
  if(S.coins < cost){ toast(`Necesitás ${cost} monedas para esta pista.`); return; }
  const x = M.x, width = M.hi - M.lo;
  if(width <= Math.max(4, x.tol*4)){ toast("El rango ya es chico: esta vez no hay pista."); return; }
  // achica el rango a la mitad, sin centrarlo en la respuesta
  const nw = Math.ceil(width/2);
  const minLo = Math.max(M.lo, x.a - nw + 1), maxLo = Math.min(x.a, M.hi - nw);
  const nlo = minLo <= maxLo ? minLo + Math.floor(Math.random()*(maxLo-minLo+1)) : M.lo;
  const nhi = nlo + nw;
  S.coins -= cost; M.hints++; save(); mLose(M.pen*2);
  document.querySelector(".coins .num").textContent = S.coins;
  const mc = document.getElementById("mhcost"); if(mc) mc.textContent = M_HINT_COST[Math.min(M.hints, M_HINT_COST.length-1)];
  if(nlo > M.lo){ M.guesses.push({v:nlo-1, dir:1, tier:mTier(nlo-1), hint:true}); M.lo = nlo; }
  if(nhi < M.hi){ M.guesses.push({v:nhi+1, dir:-1, tier:mTier(nhi+1), hint:true}); M.hi = nhi; }
  toast(`Pista: la respuesta está entre ${mFmt(M.lo)} y ${mFmt(M.hi)}.`);
  mRender();
}
function mGiveUp(btn){
  if(!M || M.done) return;
  if(!btn.dataset.sure){ btn.dataset.sure="1"; btn.innerHTML = `¿Seguro?<small>tocá de nuevo</small>`;
    timers.push(setTimeout(()=>{ if(document.body.contains(btn)){ delete btn.dataset.sure; btn.innerHTML=`Rendirse<small>ver la respuesta</small>`; } }, 3000)); return; }
  mEnd(false);
}
function mLose(p){
  const before = M.pts; M.pts = Math.max(M_MIN, M.pts - p);
  const box = document.getElementById("mpts"), v = document.getElementById("mptsv");
  if(v) v.textContent = mFmt(M.pts);
  if(box && before > M.pts){
    box.insertAdjacentHTML("beforeend", `<span class="mminus">−${before - M.pts}</span>`);
    const m = box.lastElementChild; timers.push(setTimeout(()=>m && m.remove(), 900));
    box.classList.toggle("low", M.pts < 400);
  }
}
function mEnd(ok){

    if(stars>prev) S.games.mayor[M.L] = stars;

  } else { beep(220,.25); if(S.games.mayor[M.L]===undefined){ S.games.mayor[M.L] = 0; save(); } }   // rendirse igual deja pasar a la siguiente
  const chips = M.guesses.filter(g=>!g.hint).map((g,i)=>`<span class="wchip mchip t-${g.tier}" style="--i:${i}"><b>${g.dir>0?"↑":g.dir<0?"↓":"✓"}</b>${mFmt(g.v)}</span>`).join("");
  $app.innerHTML = `${topBar("mlevels")}
  <div class="result mood-${ok?"good":"bad"}">
    <div class="verdict">
      <h1>${ok?"¡Lo encontraste!":"Te rendiste"}</h1>
      <p>${esc(x.q)}</p>
      <div class="wordball num">${mFmt(x.a)}${x.u?` <small>${esc(x.u)}</small>`:""}</div>
      ${ok?`<div class="stars" aria-label="${stars} de 3 estrellas">${"★".repeat(stars)}<span class="off">${"★".repeat(3-stars)}</span></div>`:""}
      ${ok?`<div class="mscore"><b class="num">${mFmt(M.pts)}</b><span>puntos${M.newBest && (n>1||M.hints) ? " · ¡tu mejor marca en este nivel!" : ""}</span></div>`:`<div class="mscore"><b class="num">0</b><span>puntos</span></div>`}
      ${ok?`<p>En <b class="num">${n}</b> ${n===1?"intento":"intentos"}. Yendo siempre a la mitad se puede en ${M.par}.</p>`:""}
    </div>
    ${x.n?`<p class="mfact">${esc(x.n)}</p>`:""}
    ${ok?`<div class="gains"><span><span class="coin"></span>+<span class="num">${coins}</span></span><span>+<span class="num">${xp}</span> XP</span></div>`:""}
    ${chips?`<div class="chainbox"><h2>Tus números</h2><div class="wchips">${chips}</div></div>`:""}
    <div class="actions">
      <button class="btn primary" data-mlv="${M.L+1}">${ok?`Nivel ${M.L+1}`:"Siguiente pregunta"}</button>
      <button class="btn" data-go="mlevels">Ver niveles</button>
    </div>
  </div>`;
  if(ok) confetti();
